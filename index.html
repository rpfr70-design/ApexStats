function VideoTab({ club, players, games, opponents, videoProjetos, setVideoProjetos, accountEmail }) {
  const [ativoId, setAtivoId] = useState(null);
  const [criando, setCriando] = useState(false);
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);
  const [novoNome, setNovoNome] = useState("");
  const [novoJogoId, setNovoJogoId] = useState("");
  const [novoTipo, setNovoTipo] = useState("youtube");
  const [novoUrl, setNovoUrl] = useState("");
  const [videosLocais, setVideosLocais] = useState({});

  const guardarProjetos = (novos) => setVideoProjetos(novos);
  const atualizarProjeto = (novo) => guardarProjetos(videoProjetos.map((p) => (p.id === novo.id ? novo : p)));
  const eliminarProjeto = (id) => { guardarProjetos(videoProjetos.filter((p) => p.id !== id)); setConfirmDeleteId(null); if (ativoId === id) setAtivoId(null); };

  const criar = (e) => {
    const ficheiro = e?.target?.files?.[0];
    if (novoTipo === "local" && !ficheiro) return;
    const id = uid();
    const projeto = { id, nome: novoNome.trim() || "Novo Projeto", jogoId: novoJogoId || null, tipo: novoTipo, url: novoTipo === "youtube" ? novoUrl.trim() : null, offsetSegundos: 0, clipes: [], capturas: [], criadoPor: accountEmail || "", criadoEm: new Date().toISOString() };
    if (ficheiro) setVideosLocais((prev) => ({ ...prev, [id]: URL.createObjectURL(ficheiro) }));
    guardarProjetos([...videoProjetos, projeto]);
    setCriando(false); setNovoNome(""); setNovoJogoId(""); setNovoUrl(""); setNovoTipo("youtube");
    setAtivoId(id);
  };

  const projetoAtivo = videoProjetos.find((p) => p.id === ativoId);
  if (projetoAtivo) {
    return <VideoProjectView club={club} players={players} games={games} opponents={opponents} projeto={projetoAtivo} setProjeto={atualizarProjeto}
      videoUrlLocal={videosLocais[projetoAtivo.id]} onEscolherFicheiro={(file) => setVideosLocais((prev) => ({ ...prev, [projetoAtivo.id]: URL.createObjectURL(file) }))}
      onVoltar={() => setAtivoId(null)} />;
  }

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
        <div style={{ fontSize: 12, color: T.sub }}>{videoProjetos.length} projeto{videoProjetos.length !== 1 ? "s" : ""} de análise de vídeo</div>
        <PrimaryBtn onClick={() => setCriando(true)}>+ Novo Projeto</PrimaryBtn>
      </div>

      {videoProjetos.length === 0 && <div style={{ textAlign: "center", color: T.sub, fontSize: 13, padding: 40 }}>Ainda sem projetos de vídeo. Cria o primeiro para começares a analisar.</div>}
      {videoProjetos.map((p) => {
        const jogo = games?.find((g) => g.id === p.jogoId);
        const adv = jogo ? opponents?.find((o) => o.id === jogo.adversarioId) : null;
        return (
          <div key={p.id} style={{ background: T.card, border: `1px solid ${T.sep}`, borderRadius: 14, padding: 14, marginBottom: 10 }}>
            {confirmDeleteId === p.id ? (
              <div>
                <div style={{ fontWeight: 800, fontSize: 14, marginBottom: 8 }}>Eliminar "{p.nome}"?</div>
                <div style={{ fontSize: 12, color: T.sub, marginBottom: 12 }}>Perdes todos os clipes e anotações deste projeto. Esta ação não pode ser desfeita.</div>
                <div style={{ display: "flex", gap: 10 }}>
                  <button onClick={() => setConfirmDeleteId(null)} style={{ flex: 1, background: T.card2, border: "none", borderRadius: 10, padding: "10px 0", color: T.text, fontFamily: FONT, cursor: "pointer" }}>Cancelar</button>
                  <button onClick={() => eliminarProjeto(p.id)} style={{ flex: 1, background: T.danger, border: "none", borderRadius: 10, padding: "10px 0", color: "#000", fontWeight: 700, fontFamily: FONT, cursor: "pointer" }}>Eliminar</button>
                </div>
              </div>
            ) : (
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <div onClick={() => setAtivoId(p.id)} style={{ flex: 1, cursor: "pointer" }}>
                  <div style={{ fontSize: 14, fontWeight: 700 }}>🎬 {p.nome}</div>
                  <div style={{ fontSize: 11, color: T.sub, marginTop: 3 }}>{p.tipo === "youtube" ? "YouTube" : "Vídeo local"}{jogo ? ` · ${adv?.nome || "Jogo"} · ${jogo.data}` : ""} · {(p.clipes || []).length} clipe{(p.clipes || []).length !== 1 ? "s" : ""}</div>
                </div>
                <button onClick={() => setConfirmDeleteId(p.id)} style={{ background: T.card2, border: `1px solid ${T.sep}`, color: T.danger, borderRadius: 12, width: 40, height: 40, flexShrink: 0, fontSize: 14, cursor: "pointer" }}>🗑</button>
              </div>
            )}
          </div>
        );
      })}

      {criando && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.7)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 200, padding: 16 }} onClick={() => setCriando(false)}>
          <div onClick={(e) => e.stopPropagation()} style={{ background: T.card, borderRadius: 18, padding: 20, width: "100%", maxWidth: 440 }}>
            <div style={{ fontSize: 15, fontWeight: 700, marginBottom: 14 }}>Novo Projeto de Vídeo</div>
            <Field label="Nome do Projeto"><input style={inputStyle} value={novoNome} onChange={(e) => setNovoNome(e.target.value)} placeholder="ex: Análise vs Rio Ave" /></Field>
            <Field label="Associar a um jogo (opcional)">
              <select style={inputStyle} value={novoJogoId} onChange={(e) => setNovoJogoId(e.target.value)}>
                <option value="">— Sem jogo associado —</option>
                {games?.filter((g) => isTerminado(g)).map((g) => <option key={g.id} value={g.id}>{opponents?.find((o) => o.id === g.adversarioId)?.nome || "Jogo"} · {g.data}</option>)}
              </select>
            </Field>
            <div style={{ display: "flex", gap: 6, marginBottom: 14 }}>
              {[["youtube", "Link (YouTube)"], ["local", "Ficheiro Local"]].map(([k, l]) => (
                <button key={k} onClick={() => setNovoTipo(k)} style={{ flex: 1, background: novoTipo === k ? T.text : T.card2, color: novoTipo === k ? "#000" : T.text, border: `1px solid ${T.sep}`, borderRadius: 10, padding: "8px 0", fontSize: 12, fontWeight: 700, cursor: "pointer", fontFamily: FONT }}>{l}</button>
              ))}
            </div>
            {novoTipo === "youtube" ? (
              <Field label="Link do YouTube"><input style={inputStyle} value={novoUrl} onChange={(e) => setNovoUrl(e.target.value)} placeholder="https://www.youtube.com/watch?v=..." /></Field>
            ) : (
              <div style={{ marginBottom: 14 }}>
                <div style={{ fontSize: 11, color: T.sub, marginBottom: 8 }}>O vídeo fica só nesta sessão (não é enviado nem guardado na conta) — os clipes e anotações ficam guardados, mas terás de voltar a escolher o ficheiro sempre que abrires este projeto.</div>
                <input type="file" accept="video/*" onChange={criar} style={{ fontSize: 12, color: T.text }} />
              </div>
            )}
            <div style={{ display: "flex", gap: 10 }}>
              <GhostBtn onClick={() => setCriando(false)}>Cancelar</GhostBtn>
              {novoTipo === "youtube" && <PrimaryBtn disabled={!novoUrl.trim()} onClick={criar}>Criar Projeto</PrimaryBtn>}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ============================== TREINOS TAB ============================== */
function TreinosTab({ players, treinos, setTreinos }) {
  const [treinoModal, setTreinoModal] = useState(null);
  const [presencaModal, setPresencaModal] = useState(null);
  const emptyTreino = () => ({ id: uid(), data: "", hora: "", local: "", objetivo: "", presencas: {} });
  const gravarTreino = () => { const exists = treinos.some((t) => t.id === treinoModal.id); setTreinos(exists ? treinos.map((t) => (t.id === treinoModal.id ? treinoModal : t)) : [...treinos, treinoModal]); setTreinoModal(null); };
  const eliminarTreino = () => { setTreinos(treinos.filter((t) => t.id !== treinoModal.id)); setTreinoModal(null); };
  const togglePresenca = (treino, playerId) => { const updated = { ...treino, presencas: { ...treino.presencas, [playerId]: !treino.presencas[playerId] } }; setPresencaModal(updated); setTreinos(treinos.map((t) => (t.id === updated.id ? updated : t))); };

  return (
    <>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
        <div style={{ fontSize: 15, fontWeight: 700 }}>Sessões de treino</div>
        <button onClick={() => setTreinoModal(emptyTreino())} style={{ width: 32, height: 32, borderRadius: 16, background: T.card, border: `1px solid ${T.sep}`, color: T.text, fontSize: 16, cursor: "pointer" }}>+</button>
      </div>
      {treinos.length === 0 && <div style={{ color: T.sub, fontSize: 13, textAlign: "center", padding: 30 }}>Ainda sem treinos agendados.</div>}
      {[...treinos].sort((a, b) => (a.data || "").localeCompare(b.data || "")).map((t) => {
        const presentes = Object.values(t.presencas || {}).filter(Boolean).length;
        return (
          <div key={t.id} style={{ background: T.card, border: `1px solid ${T.sep}`, borderRadius: 14, padding: 14, marginBottom: 10 }}>
            <div style={{ display: "flex", justifyContent: "space-between" }}>
              <div><div style={{ fontWeight: 700, fontSize: 14 }}>{t.objetivo || "Treino"}</div><div style={{ fontSize: 12, color: T.sub, marginTop: 2 }}>{t.data || "sem data"} {t.hora ? `· ${t.hora}` : ""} {t.local ? `· ${t.local}` : ""}</div></div>
              <div style={{ display: "flex", gap: 8 }}>
                <button onClick={() => setPresencaModal(t)} style={{ background: T.card2, border: `1px solid ${T.sep}`, color: T.text, borderRadius: 10, padding: "6px 10px", fontSize: 12, fontWeight: 600, cursor: "pointer", fontFamily: FONT }}>Presenças ({presentes})</button>
                <button onClick={() => setTreinoModal(t)} style={{ background: "none", border: "none", color: T.sub, fontSize: 18, cursor: "pointer" }}>›</button>
              </div>
            </div>
          </div>
        );
      })}
      {treinoModal && (
        <Modal title="Treino" onClose={() => setTreinoModal(null)} onSave={gravarTreino} onDelete={treinos.some((t) => t.id === treinoModal.id) ? eliminarTreino : null}>
          <Field label="Objetivo / tipo de sessão"><input style={inputStyle} value={treinoModal.objetivo} onChange={(e) => setTreinoModal({ ...treinoModal, objetivo: e.target.value })} /></Field>
          <Field label="Data"><input style={inputStyle} type="date" value={treinoModal.data} onChange={(e) => setTreinoModal({ ...treinoModal, data: e.target.value })} /></Field>
          <Field label="Hora"><input style={inputStyle} type="time" value={treinoModal.hora} onChange={(e) => setTreinoModal({ ...treinoModal, hora: e.target.value })} /></Field>
          <Field label="Local"><input style={inputStyle} value={treinoModal.local} onChange={(e) => setTreinoModal({ ...treinoModal, local: e.target.value })} /></Field>
        </Modal>
      )}
      {presencaModal && (
        <div onClick={() => setPresencaModal(null)} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.6)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 50 }}>
          <div onClick={(e) => e.stopPropagation()} style={{ background: T.card, borderRadius: 20, border: `1px solid ${T.sep}`, width: 340, maxWidth: "90vw", maxHeight: "80vh", overflowY: "auto", padding: 20, fontFamily: FONT }}>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 14 }}><div style={{ fontWeight: 700 }}>Presenças</div><button onClick={() => setPresencaModal(null)} style={{ background: "none", border: "none", color: "#0A84FF", cursor: "pointer", fontFamily: FONT }}>Fechar</button></div>
            {players.map((p) => { const on = !!presencaModal.presencas[p.id]; return (
              <div key={p.id} onClick={() => togglePresenca(presencaModal, p.id)} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 0", borderBottom: `1px solid ${T.sep}`, cursor: "pointer" }}>
                <Avatar label={initials(p.nome)} size={28} /><div style={{ flex: 1, fontSize: 13 }}>{p.nome}</div><div style={{ width: 20, height: 20, borderRadius: 10, border: `2px solid ${on ? T.success : T.sep}`, background: on ? T.success : "transparent" }} />
              </div>
            ); })}
          </div>
        </div>
      )}
    </>
  );
}

/* ============================== CALENDÁRIO TAB ============================== */
function CalendarioTab({ games, treinos, accent }) {
  const [monthOffset, setMonthOffset] = useState(0);
  const [selectedDay, setSelectedDay] = useState(null);
  const today = new Date();
  const refDate = new Date(today.getFullYear(), today.getMonth() + monthOffset, 1);
  const year = refDate.getFullYear(), month = refDate.getMonth();
  const firstWeekday = (new Date(year, month, 1).getDay() + 6) % 7;
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const pad = (n) => n.toString().padStart(2, "0");
  const dayKey = (d) => `${year}-${pad(month + 1)}-${pad(d)}`;
  const eventsByDay = useMemo(() => {
    const map = {};
    games.forEach((g) => { if (g.data) (map[g.data] = map[g.data] || []).push({ tipo: "jogo", ref: g }); });
    treinos.forEach((t) => { if (t.data) (map[t.data] = map[t.data] || []).push({ tipo: "treino", ref: t }); });
    return map;
  }, [games, treinos]);
  const cells = []; for (let i = 0; i < firstWeekday; i++) cells.push(null); for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  return (
    <>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 14 }}>
        <button onClick={() => setMonthOffset((m) => m - 1)} style={{ background: T.card, border: `1px solid ${T.sep}`, color: T.text, borderRadius: 10, padding: "6px 12px", cursor: "pointer", fontFamily: FONT }}>‹</button>
        <div style={{ fontWeight: 700, fontSize: 15 }}>{MESES[month]} {year}</div>

function SubTabelaBolaParadaPDF({ printColor, titulo, stats, sofridos }) {

  CATEGORIAS_BP.forEach(([k, label]) => {
    const variantes = VARIANTES_BP[k];
    const labelBase = sofridos ? `${label} Contra` : label;
    if (variantes) {
      const norm = normalizarCategoriaBP(k, stats[k]);
      variantes.forEach((v) => linhas.push([`${labelBase} — ${LABEL_VARIANTE_BP[v]}`, norm[v]]));

      linhas.push([labelBase, normalizarCategoriaBP(k, stats[k])]);

  });
  return (

            {linhas.map(([label, d], i) => {

              return (
                <tr key={label} style={{ background: i % 2 ? "#fafafa" : "#fff" }}>
                  <td style={{ padding: 4, fontWeight: 600 }}>{label}</td>
                  <td style={{ padding: 4, textAlign: "center" }}>{d.golos}</td>
                  <td style={{ padding: 4, textAlign: "center" }}>{d.total}</td>
                  <td style={{ padding: 4, textAlign: "center", fontWeight: 700, color: corPctBP(pct) }}>{pct.toFixed(1)}%</td>

              );
            })}

            </tr>
          </tbody>
        </table>
      </div>
    </div>
  );

          <div style={{ fontSize: 14, fontWeight: 800, color: printColor, borderLeft: `4px solid ${printColor}`, paddingLeft: 10, marginBottom: 14 }}>📊 Resultados &amp; Estatísticas</div>
          <div style={{ background: "#fafafa", borderRadius: 12, padding: "16px 18px", boxShadow: "0 2px 8px rgba(0,0,0,0.04)" }}>
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, fontWeight: 700, color: "#888", marginBottom: 14 }}>
              <span>{game.mandante === "fora" ? adversario?.nome : club.nome}</span><span>{game.mandante === "fora" ? club.nome : adversario?.nome}</span>
            </div>
            <StatBarPair emoji="🥅" label="Remates à Baliza" casa={stats.rematesBaliza.casa} fora={stats.rematesBaliza.fora} mandanteFora={game.mandante === "fora"} printColor={printColor} printColorAdv={printColorAdv} />
            <StatBarPair emoji="💨" label="Remates para Fora" casa={stats.rematesFora.casa} fora={stats.rematesFora.fora} mandanteFora={game.mandante === "fora"} printColor={printColor} printColorAdv={printColorAdv} />
            <StatBarPair emoji="🛡️" label="Remates Bloqueados" casa={stats.rematesBloqueados.casa} fora={stats.rematesBloqueados.fora} mandanteFora={game.mandante === "fora"} printColor={printColor} printColorAdv={printColorAdv} />
            <StatBarPair emoji="🚩" label="Cantos" casa={stats.cantos.casa} fora={stats.cantos.fora} mandanteFora={game.mandante === "fora"} printColor={printColor} printColorAdv={printColorAdv} />
            <StatBarPair emoji="🚫" label="Fora de Jogo" casa={stats.foraDeJogo.casa} fora={stats.foraDeJogo.fora} mandanteFora={game.mandante === "fora"} printColor={printColor} printColorAdv={printColorAdv} />
            <StatBarPair emoji="✋" label="Faltas" casa={stats.faltas.casa} fora={stats.faltas.fora} mandanteFora={game.mandante === "fora"} printColor={printColor} printColorAdv={printColorAdv} />
            <StatBarPair emoji="🟨" label="Cartões Amarelos" casa={stats.amarelos.casa} fora={stats.amarelos.fora} mandanteFora={game.mandante === "fora"} printColor={printColor} printColorAdv={printColorAdv} />
            <StatBarPair emoji="🟥" label="Cartões Vermelhos" casa={stats.vermelhos.casa} fora={stats.vermelhos.fora} mandanteFora={game.mandante === "fora"} printColor={printColor} printColorAdv={printColorAdv} />
            <div style={{ borderTop: "1px solid #e5e5e5", marginTop: 4, paddingTop: 14 }}>
              <StatBarPair emoji="🥅" label="Pontapés de Baliza" casa={pontapes.casa} fora={pontapes.fora} mandanteFora={game.mandante === "fora"} printColor={printColor} printColorAdv={printColorAdv} />
              <StatBarPair emoji="🔁" label="Posse de Bola (%) · época toda" casa={stats.posse.casa} fora={stats.posse.fora} mandanteFora={game.mandante === "fora"} printColor={printColor} printColorAdv={printColorAdv} />
              <div style={{ fontSize: 10, color: "#999", marginTop: -6 }}>Os passes e os pontapés de baliza não têm minuto associado, por isso não são divididos por parte.</div>
            </div>
          </div>
        </div>

        <div className="pdf-block" style={{ marginTop: 24 }}>
          <div style={{ fontSize: 14, fontWeight: 800, color: printColor, borderLeft: `4px solid ${printColor}`, paddingLeft: 10, marginBottom: 14 }}>🕒 Eventos</div>
          <div style={{ border: "1px solid #eee", borderRadius: 14, overflow: "hidden", boxShadow: "0 2px 8px rgba(0,0,0,0.04)" }}>
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 11 }}>
              <thead><tr>{["Tempo", "Jogador", "Evento"].map((h) => <th key={h} style={{ background: printColor, color: "#fff", padding: 8 }}>{h}</th>)}</tr></thead>
              <tbody>{eventosOrdenados.map((a, i) => <tr key={a.id} style={{ background: i % 2 ? "#fafafa" : "#fff" }}><td style={{ padding: 7, textAlign: "center" }}>{a.minuto}'</td><td style={{ padding: 7, textAlign: "center" }}>{a.tipo === "Substituição" ? "-" : nomeJogador(a.equipa, a.jogador)}</td><td style={{ padding: 7, textAlign: "center" }}>{emojiFor(a.tipo)} {a.tipo}</td></tr>)}</tbody>
            </table>
          </div>
        </div>

        {(() => {
          const statsOf = game.bolasParadasStats?.casa;
          const statsDef = game.bolasParadasStats?.fora;
          const temOf = statsOf && CATEGORIAS_BP.some(([k]) => categoriaTotaisBP(k, statsOf[k]).total > 0);
          const temDef = statsDef && CATEGORIAS_BP.some(([k]) => categoriaTotaisBP(k, statsDef[k]).total > 0);
          if (!temOf && !temDef) return null;
          return (
            <>
              <EstatisticasBolaParadaPDF printColor={printColor} clubeNome={club.nome} statsOf={temOf ? statsOf : null} statsDef={temDef ? statsDef : null} />
            </>
          );
        })()}

        {(() => {
          const acoesComCoord = actions.filter((a) => a.x != null && a.y != null);
          if (acoesComCoord.length === 0) return null;
          return (
            <div className="pdf-block" style={{ marginTop: 24 }}>
              <div style={{ fontSize: 14, fontWeight: 800, color: printColor, borderLeft: `4px solid ${printColor}`, paddingLeft: 10, marginBottom: 14 }}>🔥 Mapa de Calor das Ações</div>
              <div style={{ background: "#fafafa", border: "1px solid #eee", borderRadius: 14, padding: 14, boxShadow: "0 2px 8px rgba(0,0,0,0.04)" }}>
                <div style={{ width: "78%", margin: "0 auto" }}>
                  <div style={{ textAlign: "center", marginBottom: 6, fontSize: 9, fontWeight: 700, color: "#888", textTransform: "uppercase", letterSpacing: 1 }}>Sentido de Ataque →</div>
                  <div style={{ position: "relative", width: "100%", height: 0, paddingBottom: "62%", background: "#2e7d32", border: "1px solid #ddd", borderRadius: 10, overflow: "hidden", boxShadow: "0 6px 16px rgba(0,0,0,0.15)" }}>
                    <div style={{ position: "absolute", inset: 0 }}>
                      <HeatmapGrid actions={acoesComCoord} />
                      <PitchLinesHorizontal color="rgba(255,255,255,0.75)" />
                    </div>
                  </div>
                </div>
                <div style={{ textAlign: "center", fontSize: 9, color: "#999", marginTop: 8 }}>Densidade de todas as ações registadas · azul = baixa frequência, vermelho = máxima concentração</div>
              </div>
            </div>
          );
        })()}

        {(() => {
          const ofensivas = actions.filter((a) => a.equipa === "casa" && ACOES_OFENSIVAS.has(a.tipo) && a.x != null && a.y != null);
          if (ofensivas.length === 0) return null;
          const contagem = { esquerdo: 0, central: 0, direito: 0 };
          ofensivas.forEach((a) => { contagem[corredorDe(a.y)]++; });
          const total = ofensivas.length;
          const pct = (n) => Math.round((n / total) * 100);
          const faixas = [["esquerdo", 0, 33.34], ["central", 33.34, 33.33], ["direito", 66.67, 33.33]];
          return (
            <div className="pdf-block" style={{ marginTop: 24 }}>
              <div style={{ fontSize: 14, fontWeight: 800, color: printColor, borderLeft: `4px solid ${printColor}`, paddingLeft: 10, marginBottom: 14 }}>↔️ Distribuição dos Ataques por Corredor</div>
              <div style={{ background: "#fafafa", border: "1px solid #eee", borderRadius: 14, padding: 14, boxShadow: "0 2px 8px rgba(0,0,0,0.04)" }}>
                <div style={{ width: "78%", margin: "0 auto" }}>
                  <div style={{ position: "relative", width: "100%", height: 0, paddingBottom: "62%", background: "#2e7d32", border: "1px solid #ddd", borderRadius: 10, overflow: "hidden", boxShadow: "0 6px 16px rgba(0,0,0,0.15)" }}>
                    <div style={{ position: "absolute", inset: 0 }}>
                      <GrassStripes />
                      {faixas.map(([key, top, h]) => (
                        <div key={key} style={{ position: "absolute", left: 0, right: 0, top: `${top}%`, height: `${h}%`, background: printColorAdv, opacity: 0.18 + 0.55 * (contagem[key] / total) }} />
                      ))}
                      <PitchLinesHorizontal color="rgba(255,255,255,0.85)" />
                      {faixas.map(([key, top, h]) => (
                        <div key={key} style={{ position: "absolute", left: 0, right: 0, top: `${top}%`, height: `${h}%`, display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
                          <svg width="26" height="12" viewBox="0 0 34 12" style={{ filter: "drop-shadow(0 2px 3px rgba(0,0,0,0.55))" }}><line x1="1" y1="6" x2="28" y2="6" stroke="#fff" strokeWidth="2.5" /><path d="M23 1 L31 6 L23 11" fill="none" stroke="#fff" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" /></svg>
                          <span style={{ fontSize: 22, fontWeight: 900, color: "#fff", textShadow: "0 2px 6px rgba(0,0,0,0.55)" }}>{pct(contagem[key])}%</span>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
                <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 8, marginTop: 10 }}>
                  {faixas.map(([key]) => (
                    <div key={key} style={{ textAlign: "center", fontSize: 9, color: "#888", fontWeight: 700, textTransform: "uppercase" }}>Corredor {key === "esquerdo" ? "Esquerdo" : key === "central" ? "Central" : "Direito"}</div>
                  ))}
                </div>
                <div style={{ textAlign: "center", fontSize: 9, color: "#999", marginTop: 8 }}>Baseado em golos, assistências, remates, cruzamentos, cantos e livres da minha equipa</div>
              </div>
            </div>
          );
        })()}

        <div className="pdf-block" style={{ textAlign: "center", marginTop: 30, paddingTop: 18, borderTop: "1px solid #eee" }}>
          <div style={{
            fontSize: 10, fontWeight: 700, letterSpacing: 2.5, textTransform: "uppercase",
            background: "linear-gradient(135deg, #F2D48A, #B9873B)", WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent", backgroundClip: "text",
          }}>
            Analyze. Perform. Win.
          </div>
          <div style={{ fontSize: 9, color: "#999", marginTop: 8 }}>Relatório gerado em {new Date().toLocaleDateString("pt-PT")}</div>
        </div>
      </div>

      <div style={{ fontSize: 16, fontWeight: 700, marginBottom: 10 }}>Mapa de Ações</div>
      <div style={{ display: "flex", gap: 6, marginBottom: 10 }}>
        {[["total", "Total"], ["primeira", "1ª Parte"], ["segunda", "2ª Parte"]].map(([key, label]) => {
          const disabled = key !== "total" && intervaloMinuto == null;
          return (
            <button key={key} disabled={disabled} onClick={() => setPeriodo(key)} title={disabled ? "Este jogo não teve o intervalo assinalado" : ""} style={{ flex: 1, background: periodo === key ? T.text : T.card, color: periodo === key ? "#000" : T.text, border: `1px solid ${T.sep}`, borderRadius: 10, padding: "8px 0", fontSize: 12, fontWeight: 700, cursor: disabled ? "not-allowed" : "pointer", opacity: disabled ? 0.4 : 1, fontFamily: FONT }}>{label}</button>
          );
        })}
      </div>
      <div style={{ display: "flex", gap: 6, overflowX: "auto", marginBottom: 12, paddingBottom: 4 }}>
        {MAP_TABS.map((t) => <button key={t.key} onClick={() => setTab(t.key)} style={{ whiteSpace: "nowrap", background: tab === t.key ? T.text : T.card, color: tab === t.key ? "#000" : T.text, border: `1px solid ${T.sep}`, borderRadius: 10, padding: "6px 12px", fontSize: 12, fontWeight: 700, cursor: "pointer", fontFamily: FONT }}>{t.label}</button>)}
      </div>
      {!activeTab?.aggregateOnly && (
        <div style={{ display: "flex", gap: 6, marginBottom: 10 }}>
          {[["pontos", "📍 Pontos"], ["calor", "🔥 Calor"]].map(([k, l]) => (
            <button key={k} onClick={() => setModoMapa(k)} style={{ flex: 1, background: modoMapa === k ? T.text : T.card, color: modoMapa === k ? "#000" : T.text, border: `1px solid ${T.sep}`, borderRadius: 10, padding: "7px 0", fontSize: 12, fontWeight: 700, cursor: "pointer", fontFamily: FONT }}>{l}</button>
          ))}
        </div>
      )}
      {activeTab?.aggregateOnly ? (
        <div style={{ background: T.card, border: `1px solid ${T.sep}`, borderRadius: 14, padding: 16 }}>
          <div style={{ fontSize: 12, color: T.sub, marginBottom: 10 }}>Os passes não têm localização individual — resumo abaixo{periodo !== "total" ? ` (${periodo === "primeira" ? "1ª Parte" : "2ª Parte"})` : ""}.</div>
          {(() => {
            const foraFirst = game.mandante === "fora";
            const cCasa = periodo === "total" ? passes.casa : (passes.casa[periodo] || { certo: 0, errado: 0 });
            const cFora = periodo === "total" ? passes.fora : (passes.fora[periodo] || { certo: 0, errado: 0 });
            const posseCasa = stats.posse.casa, posseFora = stats.posse.fora;
            return (
              <>
                <StatRow a={foraFirst ? cFora.certo : cCasa.certo} label="Passes Certos" b={foraFirst ? cCasa.certo : cFora.certo} accentA={foraFirst ? accentAdv : accent} accentB={foraFirst ? accent : accentAdv} />
                <StatRow a={foraFirst ? cFora.errado : cCasa.errado} label="Passes Errados" b={foraFirst ? cCasa.errado : cFora.errado} accentA={foraFirst ? accentAdv : accent} accentB={foraFirst ? accent : accentAdv} />
                {periodo === "total" && <StatRow a={foraFirst ? posseFora : posseCasa} label="Posse de Bola (%)" b={foraFirst ? posseCasa : posseFora} accentA={foraFirst ? accentAdv : accent} accentB={foraFirst ? accent : accentAdv} />}
              </>
            );
          })()}
        </div>
      ) : modoMapa === "calor" ? (
        <div style={{ maxWidth: 620, margin: "0 auto" }}>
          <SetaSentido />
          <div style={{ position: "relative", width: "100%", aspectRatio: "100 / 62", background: "#2e7d32", border: `1px solid ${T.sep}`, borderRadius: 12, overflow: "hidden" }}>
            <GrassStripes />
            <PitchLinesHorizontal />
            <HeatmapGrid actions={mapActions} />
            {mapActions.length === 0 && <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", color: "#fff", fontSize: 12, textAlign: "center", padding: 20 }}>Sem ações deste tipo.</div>}
          </div>
        </div>
      ) : (
        <div style={{ position: "relative", width: "100%", maxWidth: 620, aspectRatio: "100 / 62", background: "#2e7d32", border: `1px solid ${T.sep}`, borderRadius: 12, margin: "0 auto" }}>
          <GrassStripes />
          <PitchLinesHorizontal />
          {mapActions.map((a) => (
            <div key={a.id} onClick={() => setSelectedDot(a)} title={`${emojiFor(a.tipo)} ${a.tipo}`} style={{ position: "absolute", left: `${a.x}%`, top: `${a.y}%`, transform: "translate(-50%,-50%)", width: 22, height: 22, borderRadius: 11, cursor: "pointer", background: a.equipa === "casa" ? accent : accentAdv, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 11, border: "1px solid rgba(0,0,0,0.4)" }}>{emojiFor(a.tipo)}</div>
          ))}
          {mapActions.length === 0 && <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", color: "#fff", fontSize: 12, textAlign: "center", padding: 20 }}>Sem ações deste tipo.</div>}
        </div>
      )}
      {selectedDot && (
        <div onClick={() => setSelectedDot(null)} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.65)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 60 }}>
          <div onClick={(e) => e.stopPropagation()} style={{ background: T.card, borderRadius: 16, padding: 20, width: 260, maxWidth: "90vw" }}>
            <div style={{ fontSize: 16, fontWeight: 800, marginBottom: 10 }}>{emojiFor(selectedDot.tipo)} {selectedDot.tipo}</div>
            <div style={{ fontSize: 13, color: T.sub, marginBottom: 4 }}>Jogador: <span style={{ color: T.text }}>{nomeJogador(selectedDot.equipa, selectedDot.jogador)}</span></div>
            <div style={{ fontSize: 13, color: T.sub, marginBottom: 4 }}>Equipa: <span style={{ color: T.text }}>{selectedDot.equipa === "casa" ? club.nome : adversario?.nome}</span></div>
            <div style={{ fontSize: 13, color: T.sub }}>Minuto: <span style={{ color: T.text }}>{selectedDot.minuto}'</span></div>
          </div>
        </div>
      )}

      {editModal && editDraft && (
        <div onClick={() => setEditModal(false)} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.6)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 60 }}>
          <div onClick={(e) => e.stopPropagation()} style={{ background: T.card, borderRadius: 20, border: `1px solid ${T.sep}`, width: 420, maxWidth: "92vw", maxHeight: "85vh", overflowY: "auto", padding: 20, fontFamily: FONT }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
              <button onClick={() => setEditModal(false)} style={{ background: "none", border: "none", color: T.sub, fontSize: 15, cursor: "pointer" }}>Cancelar</button>
              <div style={{ fontSize: 15, fontWeight: 700 }}>Editar Jogo</div>
              <button onClick={guardarEdicao} style={{ background: "none", border: "none", color: "#0A84FF", fontSize: 15, fontWeight: 700, cursor: "pointer" }}>Guardar</button>
            </div>
            <Field label="Competição"><input style={inputStyle} value={editDraft.competicao} onChange={(e) => setEditDraft({ ...editDraft, competicao: e.target.value })} /></Field>
            <Field label="Estádio"><input style={inputStyle} value={editDraft.estadio} onChange={(e) => setEditDraft({ ...editDraft, estadio: e.target.value })} /></Field>
            <Field label="Data"><input style={inputStyle} type="date" value={editDraft.data} onChange={(e) => setEditDraft({ ...editDraft, data: e.target.value })} /></Field>

            <div style={{ fontSize: 12, fontWeight: 700, color: T.sub, marginTop: 14, marginBottom: 8 }}>EVENTOS ({editDraft.actions.length})</div>
            <div style={{ background: T.card2, borderRadius: 12, maxHeight: 220, overflowY: "auto", marginBottom: 14 }}>
              {editDraft.actions.length === 0 && <div style={{ padding: 14, color: T.sub, fontSize: 12, textAlign: "center" }}>Sem eventos.</div>}
              {editDraft.actions.map((a) => (
                <div key={a.id} style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 12px", borderBottom: `1px solid ${T.sep}`, fontSize: 12 }}>
                  <span style={{ width: 28, color: T.sub, fontWeight: 700 }}>{a.minuto}'</span>
                  <span style={{ flex: 1 }}>{emojiFor(a.tipo)} {a.tipo} — {a.tipo === "Substituição" ? `saiu ${nomeJogador(a.equipa, a.saiuId)}, entrou ${nomeJogador(a.equipa, a.jogador)}` : nomeJogador(a.equipa, a.jogador)}</span>
                  <button onClick={() => removerEvento(a.id)} style={{ background: "none", border: "none", color: T.danger, cursor: "pointer", fontSize: 13 }}>🗑</button>
                </div>
              ))}
            </div>

            <div style={{ fontSize: 12, fontWeight: 700, color: T.sub, marginBottom: 8 }}>ADICIONAR EVENTO</div>
            <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
              <select style={inputStyle} value={novoEvento?.equipa || "casa"} onChange={(e) => setNovoEvento({ ...(novoEvento || {}), equipa: e.target.value, jogador: null })}>
                <option value="casa">{club.nome}</option>
                <option value="fora">{adversario?.nome || "Adversário"}</option>
              </select>
              <select style={inputStyle} value={novoEvento?.tipo || ""} onChange={(e) => setNovoEvento({ ...(novoEvento || { equipa: "casa" }), tipo: e.target.value })}>
                <option value="">Tipo de ação</option>
                {ACOES.filter((a) => a.tipo !== "Substituição").map((a) => <option key={a.tipo} value={a.tipo}>{a.emoji} {a.tipo}</option>)}
              </select>
            </div>
            <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
              <select style={inputStyle} value={novoEvento?.jogador || ""} onChange={(e) => setNovoEvento({ ...(novoEvento || { equipa: "casa" }), jogador: e.target.value })}>
                <option value="">Jogador</option>
                {(novoEvento?.equipa === "fora" ? plantelFora : players).map((p) => <option key={p.id} value={p.id}>#{p.numero} {p.nome}</option>)}
              </select>
              <input style={{ ...inputStyle, width: 90 }} type="number" min="1" placeholder="Min." value={novoEvento?.minuto || ""} onChange={(e) => setNovoEvento({ ...(novoEvento || { equipa: "casa" }), minuto: e.target.value })} />
            </div>
            <button onClick={adicionarEvento} style={{ width: "100%", background: T.card2, border: `1px solid ${T.sep}`, color: T.text, borderRadius: 10, padding: "10px 0", fontSize: 13, fontWeight: 700, fontFamily: FONT, cursor: "pointer" }}>+ Adicionar Evento</button>
          </div>
        </div>
      )}
    </div>
  );
}

function RelatoriosTab({ club, players, opponents, games, setGames, reportGameId, setReportGameId }) {
  const finished = games.filter(isTerminado);
  const [pastaAtiva, setPastaAtiva] = useState(null);
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);
  const selected = finished.find((g) => g.id === reportGameId);

  const pastas = useMemo(() => {
    const map = {};
    finished.forEach((g) => { const nome = g.competicao || "Sem competição"; (map[nome] = map[nome] || []).push(g); });
    return Object.entries(map).map(([nome, jogos]) => ({ nome, jogos: jogos.sort((a, b) => (b.data || "").localeCompare(a.data || "")) })).sort((a, b) => a.nome.localeCompare(b.nome));
  }, [finished]);

  useEffect(() => {
    if (reportGameId) {
      const g = finished.find((x) => x.id === reportGameId);
      if (g) setPastaAtiva(g.competicao || "Sem competição");
    }
  }, [reportGameId]);

  const updateGame = (updated) => setGames(games.map((g) => (g.id === updated.id ? updated : g)));
  const deleteGame = (id) => {
    const remaining = games.filter((g) => g.id !== id);
    setGames(remaining);
    if (reportGameId === id) setReportGameId(null);
    setConfirmDeleteId(null);
  };

  if (finished.length === 0) return <div style={{ textAlign: "center", color: T.sub, padding: 30, fontSize: 14 }}>Ainda sem jogos terminados. Termina um jogo no separador Jogos para gerar o relatório.</div>;

  // Nível 3: relatório de um jogo específico
  if (selected) {
    return (
      <>
        <GhostBtn onClick={() => setReportGameId(null)}>‹ {pastaAtiva}</GhostBtn>
        <div style={{ marginTop: 10 }}>
          <RelatorioDetalhe club={club} players={players} opponents={opponents} game={selected} onUpdateGame={updateGame} />
        </div>
      </>
    );
  }

  // Nível 2: lista de jogos dentro da pasta ativa
  if (pastaAtiva) {
    const pasta = pastas.find((p) => p.nome === pastaAtiva);
    return (
      <>
        <GhostBtn onClick={() => setPastaAtiva(null)}>‹ Pastas</GhostBtn>
        <div style={{ fontSize: 18, fontWeight: 800, margin: "10px 0 16px" }}>📁 {pastaAtiva}</div>
        {(pasta?.jogos || []).map((g) => {
          const adv = opponents.find((o) => o.id === g.adversarioId);
          return (
            <div key={g.id} style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
              <div onClick={() => setReportGameId(g.id)} style={{ flex: 1, display: "flex", alignItems: "center", gap: 14, background: T.card, border: `1px solid ${T.sep}`, borderRadius: 16, padding: 14, cursor: "pointer" }}>
                <Avatar label={g.mandante === "fora" ? (adv?.simbolo || "ADV") : club.simbolo} bg={g.mandante === "fora" ? adv?.corPrimaria : club.corPrimaria} size={34} photo={g.mandante === "fora" ? adv?.foto : club.foto} />
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 14, fontWeight: 700 }}>{g.mandante === "fora" ? `${adv?.nome || "?"} vs ${club.nome}` : `${club.nome} vs ${adv?.nome || "?"}`}</div>
                  <div style={{ fontSize: 12, color: T.sub }}>{g.data || "sem data"}</div>
                </div>
                <div style={{ fontSize: 15, fontWeight: 800 }}>{g.mandante === "fora" ? `${g.score.fora} : ${g.score.casa}` : `${g.score.casa} : ${g.score.fora}`}</div>
              </div>

            </div>
          );
        })}
        {confirmDeleteId && (
          <div onClick={() => setConfirmDeleteId(null)} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.65)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 60 }}>

              <div style={{ fontWeight: 800, fontSize: 15, marginBottom: 8 }}>Eliminar relatório?</div>
              <div style={{ fontSize: 13, color: T.sub, marginBottom: 16 }}>Esta ação remove o jogo e todas as estatísticas associadas. Não pode ser desfeita.</div>
              <div style={{ display: "flex", gap: 10 }}>
                <button onClick={() => setConfirmDeleteId(null)} style={{ flex: 1, background: T.card2, border: "none", borderRadius: 10, padding: "10px 0", color: T.text, fontFamily: FONT, cursor: "pointer" }}>Cancelar</button>
                <button onClick={() => deleteGame(confirmDeleteId)} style={{ flex: 1, background: T.danger, border: "none", borderRadius: 10, padding: "10px 0", color: "#000", fontWeight: 700, fontFamily: FONT, cursor: "pointer" }}>Eliminar</button>
              </div>
            </div>
          </div>
        )}
      </>
    );
  }

  // Nível 1: pastas por competição
  return (
    <>
      <div style={{ fontSize: 13, fontWeight: 700, color: T.sub, marginBottom: 14 }}>PASTAS · {pastas.length}</div>
      {pastas.map((p) => (
        <div key={p.nome} onClick={() => setPastaAtiva(p.nome)} style={{ display: "flex", alignItems: "center", gap: 14, background: T.card, border: `1px solid ${T.sep}`, borderRadius: 16, padding: 16, marginBottom: 10, cursor: "pointer" }}>

function App({ onLogout, accountEmail, adminSlot } = {}) {
  const [loading, setLoading] = useState(true);
  const [tab, setTab] = useState("equipa");
  const [club, setClubState] = useState(CLUB_DEFAULT);
  const [players, setPlayersState] = useState([]);

  const [treinos, setTreinosState] = useState([]);
  const [competicoes, setCompeticoesState] = useState([]);
  const [analises, setAnalisesState] = useState([]);
  const [planos, setPlanosState] = useState([]);
  const [wellnessEntries, setWellnessEntriesState] = useState([]);
  const [pseEntries, setPseEntriesState] = useState([]);
  const [videoProjetos, setVideoProjetosState] = useState([]);
  const [user, setUserState] = useState(USER_DEFAULT);
  const [reportGameId, setReportGameId] = useState(null);

  useEffect(() => {
    (async () => {
      const c = await safeGet("meuClube"); if (c) setClubState(c);
      const p = await safeGet("meuPlantel"); if (p) setPlayersState(p.map((pl) => (pl.pe === "Ambidextro" ? { ...pl, pe: "Ambidestro" } : pl)));
      const o = await safeGet("adversarios"); if (o) setOpponentsState(o);
      const g = await safeGet("jogos"); if (g) setGamesState(g);
      const t = await safeGet("treinos"); if (t) setTreinosState(t);
      const comp = await safeGet("competicoes"); if (comp) setCompeticoesState(comp);
      const an = await safeGet("analises"); if (an) setAnalisesState(an);
      const pl = await safeGet("planos"); if (pl) setPlanosState(pl);
      const we = await safeGet("wellnessEntries"); if (we) setWellnessEntriesState(we);
      const pe = await safeGet("pseEntries"); if (pe) setPseEntriesState(pe);
      const vp = await safeGet("videoProjetos"); if (vp) setVideoProjetosState(vp);
      const u = await safeGet("perfilUtilizador"); if (u) setUserState(u);
      setLoading(false);
    })();
  }, []);

  const setClub = (v) => { setClubState(v); safeSet("meuClube", v); };
  const setPlayers = (v) => { setPlayersState(v); safeSet("meuPlantel", v); };
  const setOpponents = (v) => { setOpponentsState(v); safeSet("adversarios", v); };
  const setGames = (v) => { setGamesState(v); safeSet("jogos", v); };
  const setTreinos = (v) => { setTreinosState(v); safeSet("treinos", v); };
  const setCompeticoes = (v) => { setCompeticoesState(v); safeSet("competicoes", v); };
  const setAnalises = (v) => { setAnalisesState(v); safeSet("analises", v); };
  const setPlanos = (v) => { setPlanosState(v); safeSet("planos", v); };
  const setWellnessEntries = (v) => { setWellnessEntriesState(v); safeSet("wellnessEntries", v); };
  const setPseEntries = (v) => { setPseEntriesState(v); safeSet("pseEntries", v); };
  const setVideoProjetos = (v) => { setVideoProjetosState(v); safeSet("videoProjetos", v); };
  const setUser = (v) => { setUserState(v); safeSet("perfilUtilizador", v); };

  const accent = accessibleAccent(club.corPrimaria);
  const goToReport = (id) => { setReportGameId(id); setTab("relatorios"); };

  if (loading) return (
    <div style={{ fontFamily: FONT, background: T.bg, color: T.sub, minHeight: 400, display: "flex", flexDirection: "column", gap: 16, alignItems: "center", justifyContent: "center", borderRadius: 24, fontSize: 13 }}>
      <AppLogo size={26} />
      A carregar…
    </div>
  );

  const TABS = [["equipa", "Equipa"], ["jogos", "Jogos"], ["individual", "Análise Individual"], ["bolasparadas", "Bolas Paradas"], ["fisica", "Condição Física"], ["estatisticas", "Estatísticas"], ["relatorios", "Relatórios"], ["definicoes", "Definições"]];

  return (
    <div style={{ fontFamily: FONT, background: T.bg, color: T.text, padding: 20, borderRadius: 24, width: "100%", maxWidth: "min(1500px, 98vw)", boxSizing: "border-box", margin: "0 auto", minHeight: 700, boxShadow: "0 30px 80px rgba(0,0,0,0.5)", border: "1px solid rgba(255,255,255,0.06)" }}>
      <style>{GLOBAL_CSS}</style>
      <div style={{ display: "flex", justifyContent: "center", marginBottom: 20 }}>
        <AppLogo />
      </div>
      <PillTabs tabs={TABS} active={tab} onChange={setTab} />

      <ErrorBoundary key={tab}>
        {tab === "equipa" && <EquipaTab club={club} setClub={setClub} players={players} setPlayers={setPlayers} opponents={opponents} setOpponents={setOpponents} games={games} accent={accent} />}
        {tab === "jogos" && <JogosTab club={club} players={players} opponents={opponents} games={games} setGames={setGames} competicoes={competicoes} setCompeticoes={setCompeticoes} accent={accent} goToReport={goToReport} />}
        {tab === "individual" && <AnaliseIndividualTab club={club} players={players} opponents={opponents} analises={analises} setAnalises={setAnalises} accent={accent} />}
        {tab === "bolasparadas" && <BolasParadasTab club={club} players={players} planos={planos} setPlanos={setPlanos} games={games} setGames={setGames} opponents={opponents} setOpponents={setOpponents} accent={accent} accountEmail={accountEmail} />}

        {tab === "definicoes" && <DefinicoesTab club={club} user={user} setUser={setUser} accent={accent} onLogout={onLogout} accountEmail={accountEmail} adminSlot={adminSlot} />}
      </ErrorBoundary>

      <AppFooter />
    </div>
  );
}

function authErrorMessage(code) {
  const map = {
    "auth/invalid-email": "Email inválido.",
    "auth/user-not-found": "Não existe nenhuma conta com este email.",
    "auth/wrong-password": "Palavra-passe incorreta.",
    "auth/invalid-credential": "Email ou palavra-passe incorretos.",
    "auth/email-already-in-use": "Já existe uma conta com este email.",
    "auth/weak-password": "A palavra-passe deve ter pelo menos 6 caracteres.",
    "auth/too-many-requests": "Demasiadas tentativas. Tenta novamente mais tarde.",
    "auth/network-request-failed": "Sem ligação à internet.",
  };
  return map[code] || "Ocorreu um erro. Tenta novamente.";
}

function AuthScreen({ onAuthed }) {
  const [mode, setMode] = useState("login");
  const [nome, setNome] = useState("");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [confirmar, setConfirmar] = useState("");
  const [erro, setErro] = useState("");
  const [loading, setLoading] = useState(false);

  const submeter = async () => {
    setErro("");
    if (!email || !password) { setErro("Preenche o email e a palavra-passe."); return; }
    if (mode === "signup" && password !== confirmar) { setErro("As palavras-passe não coincidem."); return; }
    setLoading(true);
    try {
      if (mode === "signup") {
        const cred = await firebase.auth().createUserWithEmailAndPassword(email, password);
        if (nome) await cred.user.updateProfile({ displayName: nome });
        CURRENT_UID = cred.user.uid;
        await safeSet("perfilUtilizador", { nome: nome || email.split("@")[0], email, criadoEm: new Date().toISOString().slice(0, 10), ultimoAcesso: new Date().toISOString().slice(0, 10), foto: null });
        // Pedido de acesso — fica pendente até seres aprovado pelo administrador
        if (email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
          try {
            await firebase.firestore().collection("acessos").doc(cred.user.uid).set({
              email, nome: nome || email.split("@")[0], estado: "pendente", criadoEm: new Date().toISOString(),
            });
          } catch (e) { console.error("Erro ao criar pedido de acesso", e); }
        }
      } else {
        const cred = await firebase.auth().signInWithEmailAndPassword(email, password);
        CURRENT_UID = cred.user.uid;
      }
      onAuthed();
    } catch (e) {
      setErro(authErrorMessage(e.code));
    }
    setLoading(false);
  };

  return (
    <div style={{ fontFamily: FONT, background: T.bg, color: T.text, minHeight: 500, borderRadius: 24, padding: 32, maxWidth: 380, margin: "40px auto", boxSizing: "border-box" }}>
      <style>{GLOBAL_CSS}</style>
      <div style={{ display: "flex", justifyContent: "center", marginBottom: 28 }}><AppLogo size={26} /></div>
      <div style={{ fontSize: 20, fontWeight: 800, textAlign: "center", marginBottom: 4 }}>{mode === "login" ? "Iniciar Sessão" : "Criar Conta"}</div>
      <div style={{ fontSize: 13, color: T.sub, textAlign: "center", marginBottom: 24 }}>{mode === "login" ? "Acede aos teus dados em qualquer dispositivo" : "Uma conta nova fica sujeita a aprovação"}</div>

      {mode === "signup" && <div style={{ marginBottom: 12 }}><input style={inputStyle} placeholder="Nome" value={nome} onChange={(e) => setNome(e.target.value)} /></div>}
      <div style={{ marginBottom: 12 }}><input style={inputStyle} type="email" placeholder="Email" value={email} onChange={(e) => setEmail(e.target.value)} /></div>
      <div style={{ marginBottom: 12 }}><input style={inputStyle} type="password" placeholder="Palavra-passe" value={password} onChange={(e) => setPassword(e.target.value)} /></div>
      {mode === "signup" && <div style={{ marginBottom: 12 }}><input style={inputStyle} type="password" placeholder="Confirmar palavra-passe" value={confirmar} onChange={(e) => setConfirmar(e.target.value)} /></div>}

      {erro && <div style={{ color: T.danger, fontSize: 12, marginBottom: 12, textAlign: "center" }}>{erro}</div>}

      <div style={{ marginBottom: 16 }}>
        <PrimaryBtn disabled={loading} onClick={submeter}>{loading ? "Aguarda…" : mode === "login" ? "Entrar" : "Criar Conta"}</PrimaryBtn>
      </div>
      <div style={{ textAlign: "center" }}>
        <GhostBtn onClick={() => { setMode(mode === "login" ? "signup" : "login"); setErro(""); }}>
          {mode === "login" ? "Não tens conta? Criar conta" : "Já tens conta? Iniciar sessão"}
        </GhostBtn>
      </div>
    </div>
  );
}

function StorageErrorBanner() {
  const [err, setErr] = useState(null);
  useEffect(() => {
    const handler = (e) => setErr(e.detail);
    window.addEventListener("apexstats-storage-error", handler);
    return () => window.removeEventListener("apexstats-storage-error", handler);
  }, []);
  if (!err) return null;
  const permissao = err.code === "permission-denied";
  return (
    <div style={{ position: "fixed", top: 0, left: 0, right: 0, zIndex: 200, background: "#3a1010", borderBottom: "1px solid #ff453a", padding: "10px 16px", fontFamily: FONT, fontSize: 12, color: "#fff", textAlign: "center" }}>
      ⚠️ Falha ao {err.action} dados ({err.key}).{" "}
      {permissao ? "As regras do Firestore estão a bloquear o acesso — confirma as regras de segurança." : err.message}
      <button onClick={() => setErr(null)} style={{ marginLeft: 10, background: "none", border: "none", color: "#fff", textDecoration: "underline", cursor: "pointer", fontFamily: FONT, fontSize: 12 }}>fechar</button>
    </div>
  );
}

/* Exporta o #report-paper para PDF, capturando cada secção (.pdf-block) separadamente e
   quebrando de página apenas entre secções — nunca a meio de uma tabela ou cartão. */
window.exportarRelatorioPDFBlocos = async function (nomeFicheiro, orientacao) {
  const container = document.getElementById("report-paper");
  if (!container || !window.html2canvas || !window.jspdf) { window.print(); return; }
  try {
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation: orientacao || "portrait", unit: "pt", format: "a4" });
    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    const margin = 20;
    const usableWidth = pageWidth - margin * 2;
    let blocks = Array.from(container.querySelectorAll(".pdf-block"));
    if (blocks.length === 0) blocks = [container];
    let y = margin;
    let pagina = 0;
    const novaPagina = () => { if (pagina > 0) pdf.addPage(); pdf.setFillColor(255, 255, 255); pdf.rect(0, 0, pageWidth, pageHeight, "F"); pagina++; y = margin; };
    novaPagina();
    for (const block of blocks) {
      const canvas = await window.html2canvas(block, { scale: 2, backgroundColor: "#ffffff", useCORS: true });
      const imgData = canvas.toDataURL("image/jpeg", 0.95);
      const blockHeight = (canvas.height * usableWidth) / canvas.width;
      if (y > margin && y + blockHeight > pageHeight - margin) novaPagina();
      pdf.addImage(imgData, "JPEG", margin, y, usableWidth, blockHeight);
      y += blockHeight + 14;
    }
    pdf.save(nomeFicheiro);
  } catch (e) {
    console.error("Erro ao gerar PDF", e);
    window.print();
  }
};

function EcraEstado({ icone, titulo, texto, onLogout, onVerificar }) {
  return (
    <div style={{ fontFamily: FONT, background: T.bg, color: T.text, minHeight: 400, borderRadius: 24, padding: 32, maxWidth: 420, margin: "40px auto", textAlign: "center", boxSizing: "border-box" }}>
      <style>{GLOBAL_CSS}</style>
      <div style={{ display: "flex", justifyContent: "center", marginBottom: 24 }}><AppLogo /></div>
      <div style={{ fontSize: 34, marginBottom: 12 }}>{icone}</div>
      <div style={{ fontSize: 17, fontWeight: 700, marginBottom: 10 }}>{titulo}</div>
      <div style={{ fontSize: 13, color: T.sub, lineHeight: 1.6, marginBottom: 24 }}>{texto}</div>
      {onVerificar && <div style={{ marginBottom: 12 }}><PrimaryBtn onClick={onVerificar}>Verificar novamente</PrimaryBtn></div>}
      <GhostBtn onClick={onLogout}>Terminar sessão</GhostBtn>
    </div>
  );
}

function PainelAprovacoes() {
  const [pedidos, setPedidos] = useState([]);
  const [loading, setLoading] = useState(true);
  const [erro, setErro] = useState("");

  const carregar = async () => {
    setLoading(true);
    setErro("");
    try {
      const snap = await firebase.firestore().collection("acessos").get();
      const lista = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      lista.sort((a, b) => (a.estado === "pendente" ? -1 : 1) - (b.estado === "pendente" ? -1 : 1));
      setPedidos(lista);
    } catch (e) { setErro(e.message); }
    setLoading(false);
  };
  useEffect(() => { carregar(); }, []);

  const atualizar = async (uid, estado) => {
    try {
      await firebase.firestore().collection("acessos").doc(uid).update({ estado });
      carregar();
    } catch (e) { alert("Erro ao atualizar: " + e.message); }
  };

  const pendentes = pedidos.filter((p) => p.estado === "pendente");
  const outros = pedidos.filter((p) => p.estado !== "pendente");

  return (
    <div style={{ background: T.card, border: `1px solid ${T.sep}`, borderRadius: 14, padding: 16 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
        <div style={{ fontSize: 12, color: T.sub }}>{pendentes.length} pedido{pendentes.length !== 1 ? "s" : ""} pendente{pendentes.length !== 1 ? "s" : ""}</div>
        <button onClick={carregar} style={{ background: "none", border: "none", color: "#0A84FF", fontSize: 12, fontWeight: 700, cursor: "pointer", fontFamily: FONT }}>Atualizar</button>
      </div>
      {loading && <div style={{ color: T.sub, fontSize: 13, textAlign: "center", padding: 12 }}>A carregar…</div>}
      {erro && <div style={{ color: T.danger, fontSize: 12, marginBottom: 10 }}>{erro}</div>}
      {!loading && pedidos.length === 0 && <div style={{ color: T.sub, fontSize: 13, textAlign: "center", padding: 12 }}>Ainda sem pedidos de acesso.</div>}
      {pendentes.map((p) => (
        <div key={p.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 0", borderBottom: `1px solid ${T.sep}` }}>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 13, fontWeight: 700 }}>{p.nome}</div>
            <div style={{ fontSize: 11, color: T.sub }}>{p.email}</div>
          </div>
          <span style={{ fontSize: 10, fontWeight: 700, color: T.warning, background: "rgba(255,214,10,0.15)", padding: "3px 8px", borderRadius: 8 }}>Pendente</span>
          <button onClick={() => atualizar(p.id, "aprovado")} style={{ background: T.success, border: "none", color: "#000", borderRadius: 8, padding: "6px 10px", fontSize: 11, fontWeight: 700, cursor: "pointer", fontFamily: FONT }}>Aprovar</button>
          <button onClick={() => atualizar(p.id, "rejeitado")} style={{ background: "transparent", border: `1px solid ${T.danger}`, color: T.danger, borderRadius: 8, padding: "6px 10px", fontSize: 11, fontWeight: 700, cursor: "pointer", fontFamily: FONT }}>Rejeitar</button>
        </div>
      ))}
      {outros.map((p) => (
        <div key={p.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 0", borderBottom: `1px solid ${T.sep}` }}>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 13, fontWeight: 700 }}>{p.nome}</div>
            <div style={{ fontSize: 11, color: T.sub }}>{p.email}</div>
          </div>
          <span style={{ fontSize: 10, fontWeight: 700, color: p.estado === "aprovado" ? T.success : T.danger, background: p.estado === "aprovado" ? "rgba(48,209,88,0.15)" : "rgba(255,69,58,0.15)", padding: "3px 8px", borderRadius: 8 }}>{p.estado === "aprovado" ? "Aprovado" : "Rejeitado"}</span>
          {p.estado === "aprovado" ? (
            <button onClick={() => atualizar(p.id, "rejeitado")} style={{ background: "transparent", border: `1px solid ${T.danger}`, color: T.danger, borderRadius: 8, padding: "6px 10px", fontSize: 11, fontWeight: 700, cursor: "pointer", fontFamily: FONT }}>Revogar</button>
          ) : (
            <button onClick={() => atualizar(p.id, "aprovado")} style={{ background: T.success, border: "none", color: "#000", borderRadius: 8, padding: "6px 10px", fontSize: 11, fontWeight: 700, cursor: "pointer", fontFamily: FONT }}>Aprovar</button>
          )}
        </div>
      ))}
    </div>
  );
}

function AuthGate() {
  const [checking, setChecking] = useState(true);
  const [user, setUser] = useState(null);
  const [acessoEstado, setAcessoEstado] = useState(null); // "admin" | "aprovado" | "pendente" | "rejeitado" | null (a verificar)

  useEffect(() => {
    if (!FIREBASE_READY) { setChecking(false); return; }
    const unsub = firebase.auth().onAuthStateChanged((u) => {
      CURRENT_UID = u ? u.uid : null;
      setUser(u);
      setChecking(false);
      if (!u) setAcessoEstado(null);
    });
    return unsub;
  }, []);

  const verificarAcesso = async () => {
    if (!user) return;
    if (user.email && user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) { setAcessoEstado("admin"); return; }
    setAcessoEstado(null);
    try {
      const snap = await firebase.firestore().collection("acessos").doc(user.uid).get();
      setAcessoEstado(snap.exists ? (snap.data().estado || "pendente") : "pendente");
    } catch (e) {
      setAcessoEstado("pendente");
    }
  };
  useEffect(() => { if (user) verificarAcesso(); }, [user]);

  if (!FIREBASE_READY) return <SetupNotice />;
  if (checking) return <div style={{ fontFamily: FONT, color: T.sub, background: T.bg, minHeight: 300, display: "flex", flexDirection: "column", gap: 16, alignItems: "center", justifyContent: "center" }}><AppLogo size={26} />A carregar…</div>;

  if (!user) return <AuthScreen onAuthed={() => setUser(firebase.auth().currentUser)} />;

  if (acessoEstado === null) return <div style={{ fontFamily: FONT, color: T.sub, background: T.bg, minHeight: 300, display: "flex", flexDirection: "column", gap: 16, alignItems: "center", justifyContent: "center" }}><AppLogo size={26} />A verificar acesso…</div>;

  if (acessoEstado === "pendente") {
    return <EcraEstado icone="⏳" titulo="Conta a aguardar aprovação" texto="A tua conta foi criada, mas ainda precisa de ser aprovada pelo administrador antes de poderes usar a app. Tenta novamente mais tarde." onLogout={() => firebase.auth().signOut()} onVerificar={verificarAcesso} />;
  }
  if (acessoEstado === "rejeitado") {
    return <EcraEstado icone="🚫" titulo="Acesso não autorizado" texto="O administrador não autorizou esta conta." onLogout={() => firebase.auth().signOut()} />;
  }

  return (
    <>
      <StorageErrorBanner />
      <App onLogout={() => firebase.auth().signOut()} accountEmail={user.email} adminSlot={acessoEstado === "admin" ? <PainelAprovacoes /> : null} />
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<AuthGate />);



</script>
