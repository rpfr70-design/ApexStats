const PLANO_TIPOS = ["Canto", "Livre Direto", "Livre Indireto", "Lateral", "Penálti", "Outro"];

function TokenView({ token, player, accent, onPointerDownToken, onRemove, onEditToken, size = 34 }) {
  let content;
  if (token.tipo === "bola") {
    content = <div style={{ fontSize: size * 0.55, lineHeight: 1, filter: "drop-shadow(0 2px 3px rgba(0,0,0,0.5))" }}>⚽</div>;
  } else if (token.tipo === "adversario") {
    content = <div style={{ width: size, height: size, borderRadius: size / 2, background: "#111111", display: "flex", alignItems: "center", justifyContent: "center", fontSize: size * 0.4, fontWeight: 800, color: "#fff", border: "2px solid #fff", boxShadow: "0 2px 5px rgba(0,0,0,0.35)" }}>A</div>;
  } else if (token.tipo === "marcador") {
    content = <div style={{ width: size * 0.85, height: size * 0.85, borderRadius: size * 0.425, background: token.cor || "#FF3B30", border: "2px solid #fff", boxShadow: "0 2px 5px rgba(0,0,0,0.35)" }} />;
  } else {
    content = (
      <div style={{ padding: token.corPapel ? 3 : 0, borderRadius: "50%", border: token.corPapel ? `3px solid ${token.corPapel}` : "none", boxShadow: token.corPapel ? "0 2px 5px rgba(0,0,0,0.35)" : "none" }}>
        <Avatar label={initials(player?.nome)} photo={player?.foto} size={size} bg={accent || "#0A84FF"} />
      </div>
    );
  }
  return (
    <div onPointerDown={onPointerDownToken} style={{ position: "absolute", left: `${token.x}%`, top: `${token.y}%`, transform: "translate(-50%,-50%)", cursor: "grab", touchAction: "none", textAlign: "center" }}>
      <div style={{ position: "relative", display: "inline-block" }}>
        {content}
        {token.tipo === "proprio" && player && <div style={{ position: "absolute", bottom: -4, right: -6, background: "#111", color: "#fff", fontSize: 9, fontWeight: 800, borderRadius: 8, padding: "1px 4px", border: "1px solid #fff", zIndex: 1 }}>{player.numero}</div>}
        {(token.tipo === "marcador" || token.tipo === "proprio") && (
          <div onClick={(e) => { e.stopPropagation(); onEditToken(); }} style={{ position: "absolute", bottom: -6, left: -6, width: 16, height: 16, borderRadius: 8, background: T.card, color: T.text, fontSize: 9, fontWeight: 900, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", border: `1px solid ${T.sep}`, zIndex: 1 }}>✎</div>
        )}
        <div onClick={(e) => { e.stopPropagation(); onRemove(); }} style={{ position: "absolute", top: -6, right: -6, width: 16, height: 16, borderRadius: 8, background: T.danger, color: "#000", fontSize: 10, fontWeight: 900, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", zIndex: 1 }}>✕</div>
      </div>
      {token.tipo === "marcador" && token.nome && <div style={{ fontSize: 9, color: "#fff", fontWeight: 700, marginTop: 2, whiteSpace: "nowrap", textShadow: "0 1px 2px rgba(0,0,0,0.6)" }}>{token.nome}</div>}
    </div>
  );
}

const CORES_MARCADOR = ["#FF3B30", "#0A84FF", "#30D158", "#FFD60A", "#FFFFFF", "#111111", "#FF9F0A", "#BF5AF2", "#FF375F", "#8E8E93"];

function PlanoTaticoEditor({ club, players, plano, onGuardar, onCancelar, accountEmail }) {
  const accent = accessibleAccent(club?.corPrimaria);
  const [nome, setNome] = useState(plano?.nome || "");
  const [tipo, setTipo] = useState(plano?.tipo || "Canto");
  const [campo, setCampo] = useState(plano?.campo || "meio");
  const [observacoes, setObservacoes] = useState(plano?.observacoes || "");
  const [legendaCores, setLegendaCores] = useState(plano?.legendaCores || {});
  const [tokens, setTokens] = useState(plano?.tokens || []);
  const [selecionado, setSelecionado] = useState(null);
  const [arrastando, setArrastando] = useState(null);
  const [editandoToken, setEditandoToken] = useState(null);
  const fieldRef = useRef(null);

  const posicaoEvento = (e) => {
    const rect = fieldRef.current.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      x: Math.min(100, Math.max(0, ((clientX - rect.left) / rect.width) * 100)),
      y: Math.min(100, Math.max(0, ((clientY - rect.top) / rect.height) * 100)),
    };
  };
  const tocarCampo = (e) => {
    if (arrastando || !selecionado) return;
    const { x, y } = posicaoEvento(e);
    const extra = selecionado.tipo === "marcador" ? { cor: CORES_MARCADOR[0], nome: "", legenda: "" } : {};
    const novoId = uid();
    setTokens((prev) => [...prev, { id: novoId, ...selecionado, ...extra, x, y }]);
    setSelecionado(null);
    if (selecionado.tipo === "marcador") setEditandoToken(novoId);
  };
  const moverPointer = (e) => {
    if (!arrastando) return;
    const { x, y } = posicaoEvento(e);
    setTokens((prev) => prev.map((t) => (t.id === arrastando ? { ...t, x, y } : t)));
  };
  const largarPointer = () => setArrastando(null);
  const removerToken = (id) => { setTokens((prev) => prev.filter((t) => t.id !== id)); if (editandoToken === id) setEditandoToken(null); };
  const atualizarToken = (id, patch) => setTokens((prev) => prev.map((t) => (t.id === id ? { ...t, ...patch } : t)));
  const limpar = () => { setTokens([]); setEditandoToken(null); };
  const guardar = () => {
    if (!nome.trim()) return;
    onGuardar({ id: plano?.id || uid(), nome: nome.trim(), tipo, campo, tokens, observacoes: observacoes.trim(), legendaCores, criadoPor: plano?.criadoPor || accountEmail || "", criadoEm: plano?.criadoEm || new Date().toISOString() });
  };
  const tokenEmEdicao = tokens.find((t) => t.id === editandoToken);
  const jogadoresUsados = new Set(tokens.filter((t) => t.tipo === "proprio").map((t) => t.jogadorId));
  const coresEmUso = [...new Set(tokens.map((t) => t.tipo === "marcador" ? t.cor : t.tipo === "proprio" ? t.corPapel : null).filter(Boolean))];

  return (
    <div style={{ maxWidth: 880, margin: "0 auto" }}>
      <GhostBtn onClick={onCancelar}>‹ Bolas Paradas</GhostBtn>

      <div style={{ marginTop: 10, marginBottom: 14 }}>
        <input style={inputStyle} placeholder="Nome do plano (ex: Canto direito, zona)" value={nome} onChange={(e) => setNome(e.target.value)} />
      </div>

      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 14 }}>
        {PLANO_TIPOS.map((t) => (
          <div key={t} onClick={() => setTipo(t)} style={{ padding: "7px 12px", borderRadius: 10, fontSize: 12, fontWeight: 700, cursor: "pointer", background: tipo === t ? T.text : T.card, color: tipo === t ? "#000" : T.text, border: `1px solid ${T.sep}` }}>{t}</div>
        ))}
      </div>

      <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
        <div onClick={() => setCampo("inteiro")} style={{ flex: 1, textAlign: "center", padding: "9px 0", borderRadius: 12, fontSize: 13, fontWeight: 700, cursor: "pointer", background: campo === "inteiro" ? T.text : T.card, color: campo === "inteiro" ? "#000" : T.text, border: `1px solid ${T.sep}` }}>🏟️ Campo Inteiro</div>
        <div onClick={() => setCampo("meio")} style={{ flex: 1, textAlign: "center", padding: "9px 0", borderRadius: 12, fontSize: 13, fontWeight: 700, cursor: "pointer", background: campo === "meio" ? T.text : T.card, color: campo === "meio" ? "#000" : T.text, border: `1px solid ${T.sep}` }}>⚽ Meio Campo</div>
      </div>

      <div style={{ fontSize: 11, color: T.sub, textAlign: "center", marginBottom: 8 }}>
        {selecionado ? "Toca no campo para colocar" : "Escolhe um jogador/marcador em baixo e depois toca no campo · arrasta para ajustar"}
      </div>

      <div ref={fieldRef} onClick={tocarCampo} onPointerMove={moverPointer} onPointerUp={largarPointer} onPointerLeave={largarPointer}
        style={{ position: "relative", width: "100%", aspectRatio: campo === "inteiro" ? "100 / 62" : "1.24", background: "#2e7d32", border: selecionado ? `2px solid ${T.warning}` : `1px solid ${T.sep}`, borderRadius: 12, overflow: "hidden", marginBottom: 16, cursor: selecionado ? "crosshair" : "default", touchAction: "none" }}>
        <GrassStripes />
        {campo === "inteiro" ? <PitchLinesHorizontal /> : <PitchHalfLines />}
        {tokens.map((t) => (
          <TokenView key={t.id} token={t} player={t.tipo === "proprio" ? players.find((p) => p.id === t.jogadorId) : null} accent={accent}
            onPointerDownToken={(e) => { e.stopPropagation(); setArrastando(t.id); }} onRemove={() => removerToken(t.id)} onEditToken={() => setEditandoToken(t.id)} />
        ))}
      </div>

      {tokenEmEdicao && tokenEmEdicao.tipo === "marcador" && (
        <div style={{ background: T.card, border: `1px solid ${T.sep}`, borderRadius: 14, padding: 14, marginBottom: 16 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
            <div style={{ fontSize: 13, fontWeight: 700 }}>🎯 Propriedades do Marcador</div>
            <button onClick={() => setEditandoToken(null)} style={{ background: "none", border: "none", color: T.sub, fontSize: 12, fontWeight: 700, cursor: "pointer", fontFamily: FONT }}>Concluído</button>
          </div>
          <div style={{ fontSize: 10, color: T.sub, fontWeight: 700, marginBottom: 6 }}>ATRIBUIR A UM JOGADOR (opcional)</div>
          <div style={{ display: "flex", gap: 8, overflowX: "auto", paddingBottom: 8, marginBottom: 14 }}>
            {players.map((p) => (
              <div key={p.id} onClick={() => atualizarToken(tokenEmEdicao.id, { tipo: "proprio", jogadorId: p.id, cor: undefined, nome: undefined, legenda: undefined, corPapel: null })} style={{ flexShrink: 0, textAlign: "center", cursor: "pointer", opacity: jogadoresUsados.has(p.id) ? 0.4 : 1 }}>
                <Avatar label={initials(p.nome)} photo={p.foto} size={36} bg={accent} />
                <div style={{ fontSize: 9, color: T.sub, marginTop: 3, maxWidth: 44, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{p.nome?.split(" ")[0]}</div>
              </div>
            ))}
          </div>
          <div style={{ fontSize: 10, color: T.sub, fontWeight: 700, marginBottom: 6, borderTop: `1px solid ${T.sep}`, paddingTop: 12 }}>OU DEIXAR COMO MARCADOR — COR</div>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 10, alignItems: "center" }}>
            {CORES_MARCADOR.map((c) => (
              <div key={c} onClick={() => atualizarToken(tokenEmEdicao.id, { cor: c })} style={{ width: 26, height: 26, borderRadius: 13, background: c, border: tokenEmEdicao.cor === c ? `2px solid ${T.warning}` : "2px solid rgba(255,255,255,0.3)", cursor: "pointer" }} />
            ))}
            <input type="color" value={tokenEmEdicao.cor || "#FF3B30"} onChange={(e) => atualizarToken(tokenEmEdicao.id, { cor: e.target.value })} style={{ width: 30, height: 26, border: "none", borderRadius: 8, background: "none", cursor: "pointer" }} />
          </div>
          <div style={{ fontSize: 10, color: T.sub, fontWeight: 700, marginBottom: 6 }}>NOME (opcional)</div>
          <input style={{ ...inputStyle, marginBottom: 10 }} placeholder="ex: Corrida do EE" value={tokenEmEdicao.nome || ""} onChange={(e) => atualizarToken(tokenEmEdicao.id, { nome: e.target.value })} />
          <div style={{ fontSize: 10, color: T.sub, fontWeight: 700, marginBottom: 6 }}>LEGENDA (opcional)</div>
          <textarea style={{ ...inputStyle, resize: "vertical" }} rows={2} placeholder="ex: Bloco ao primeiro poste para desviar à baliza" value={tokenEmEdicao.legenda || ""} onChange={(e) => atualizarToken(tokenEmEdicao.id, { legenda: e.target.value })} />
        </div>
      )}

      {tokenEmEdicao && tokenEmEdicao.tipo === "proprio" && (
        <div style={{ background: T.card, border: `1px solid ${T.sep}`, borderRadius: 14, padding: 14, marginBottom: 16 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
            <div style={{ fontSize: 13, fontWeight: 700 }}>👤 {players.find((p) => p.id === tokenEmEdicao.jogadorId)?.nome || "Jogador"}</div>
            <button onClick={() => setEditandoToken(null)} style={{ background: "none", border: "none", color: T.sub, fontSize: 12, fontWeight: 700, cursor: "pointer", fontFamily: FONT }}>Concluído</button>
          </div>
          <div style={{ fontSize: 10, color: T.sub, fontWeight: 700, marginBottom: 6 }}>COR DO PAPEL (anel à volta da foto — opcional)</div>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center" }}>
            <div onClick={() => atualizarToken(tokenEmEdicao.id, { corPapel: null })} style={{ width: 26, height: 26, borderRadius: 13, background: T.card2, border: !tokenEmEdicao.corPapel ? `2px solid ${T.warning}` : `1px solid ${T.sep}`, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 10, color: T.sub }}>✕</div>
            {CORES_MARCADOR.map((c) => (
              <div key={c} onClick={() => atualizarToken(tokenEmEdicao.id, { corPapel: c })} style={{ width: 26, height: 26, borderRadius: 13, background: c, border: tokenEmEdicao.corPapel === c ? `2px solid ${T.warning}` : "2px solid rgba(255,255,255,0.3)", cursor: "pointer" }} />

const CATEGORIAS_BP = [["cantos", "🚩 Cantos"], ["livresDiretos", "🎯 Livres Diretos"], ["livresIndiretos", "🦶 Livres Indiretos"], ["penaltis", "⚪ Penáltis"]];
const VARIANTES_BP = { cantos: ["direito", "esquerdo"], livresDiretos: ["direito", "centro", "esquerdo"], livresIndiretos: ["direito", "centro", "esquerdo"], penaltis: null };
const LABEL_VARIANTE_BP = { direito: "Direito", centro: "Centro", esquerdo: "Esquerdo" };
function categoriaVazia() { return { total: 0, golos: 0 }; }
function statsBPVazio() {
  const s = {};
  CATEGORIAS_BP.forEach(([k]) => {
    const variantes = VARIANTES_BP[k];
    s[k] = variantes ? Object.fromEntries(variantes.map((v) => [v, categoriaVazia()])) : categoriaVazia();
  });
  return s;
}
// Normaliza uma categoria (garante todas as variantes presentes e migra dados antigos sem variante)
function normalizarCategoriaBP(catKey, dadosCat) {
  const variantes = VARIANTES_BP[catKey];
  if (!variantes) return dadosCat && typeof dadosCat.total === "number" ? dadosCat : categoriaVazia();
  if (!dadosCat) return Object.fromEntries(variantes.map((v) => [v, categoriaVazia()]));
  if (typeof dadosCat.total === "number") {
    // formato antigo (sem variantes) — migra tudo para a primeira variante, para não perder dados
    const migrado = Object.fromEntries(variantes.map((v) => [v, categoriaVazia()]));
    migrado[variantes[0]] = { total: dadosCat.total || 0, golos: dadosCat.golos || 0 };
    return migrado;
  }
  const completo = {};
  variantes.forEach((v) => { completo[v] = dadosCat[v] || categoriaVazia(); });
  return completo;
}
function normalizarStatsBP(stats) {
  const s = {};
  CATEGORIAS_BP.forEach(([k]) => { s[k] = normalizarCategoriaBP(k, stats?.[k]); });
  return s;
}
// Soma total/golos de uma categoria (todas as variantes, ou o valor direto se não tiver variantes)
function categoriaTotaisBP(catKey, dadosCat) {
  const variantes = VARIANTES_BP[catKey];
  const norm = normalizarCategoriaBP(catKey, dadosCat);
  if (!variantes) return norm;
  return Object.values(norm).reduce((acc, v) => ({ total: acc.total + (v.total || 0), golos: acc.golos + (v.golos || 0) }), categoriaVazia());
}
// Aplica a diferença (antes → depois) de uma categoria a um outro conjunto de estatísticas — usado para ligar
// automaticamente a ofensiva de uma equipa à defensiva de outra, sem duplicar a introdução de dados.
function aplicarDeltaCategoriaBP(catKey, statsAlvo, catAntiga, catNova) {
  const variantes = VARIANTES_BP[catKey];
  const novoStatsAlvo = { ...statsAlvo };
  if (!variantes) {
    const a = catAntiga && typeof catAntiga.total === "number" ? catAntiga : categoriaVazia();
    const n = catNova || categoriaVazia();
    const atual = novoStatsAlvo[catKey] || categoriaVazia();
    novoStatsAlvo[catKey] = { total: Math.max(0, atual.total + (n.total - a.total)), golos: Math.max(0, atual.golos + (n.golos - a.golos)) };
  } else {
    const aNorm = normalizarCategoriaBP(catKey, catAntiga);
    const nNorm = normalizarCategoriaBP(catKey, catNova);
    const atual = normalizarCategoriaBP(catKey, novoStatsAlvo[catKey]);
    const resultado = {};
    variantes.forEach((v) => {
      resultado[v] = { total: Math.max(0, atual[v].total + (nNorm[v].total - aNorm[v].total)), golos: Math.max(0, atual[v].golos + (nNorm[v].golos - aNorm[v].golos)) };
    });
    novoStatsAlvo[catKey] = resultado;
  }
  return novoStatsAlvo;
}
function pctBP(golos, total) { return total ? Math.round((golos / total) * 1000) / 10 : 0; }
function corPctBP(pct) { return pct <= 30 ? T.danger : pct <= 60 ? T.warning : T.success; }
function aproveitamentoBP(stats) {
  let totalBP = 0, totalGolos = 0;
  CATEGORIAS_BP.forEach(([k]) => { const t = categoriaTotaisBP(k, stats?.[k]); totalBP += t.total; totalGolos += t.golos; });
  return { totalBP, totalGolos, pct: pctBP(totalGolos, totalBP) };
}

function StepperBP({ value, onChange, max }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
      <button onClick={() => onChange(Math.max(0, value - 1))} style={{ width: 26, height: 26, borderRadius: 8, background: T.card2, border: `1px solid ${T.sep}`, color: T.text, fontSize: 14, fontWeight: 700, cursor: "pointer" }}>−</button>
      <input type="number" value={value} onChange={(e) => { const v = Number(e.target.value) || 0; onChange(max != null ? Math.min(v, max) : v); }} style={{ width: 44, textAlign: "center", background: T.card2, border: `1px solid ${T.sep}`, borderRadius: 8, color: T.text, fontSize: 13, fontWeight: 700, fontFamily: FONT, padding: "5px 2px" }} />
      <button onClick={() => onChange(max != null ? Math.min(max, value + 1) : value + 1)} style={{ width: 26, height: 26, borderRadius: 8, background: T.card2, border: `1px solid ${T.sep}`, color: T.text, fontSize: 14, fontWeight: 700, cursor: "pointer" }}>+</button>
    </div>
  );
}

}

function CategoriaBPGrupo({ label, catKey, dados, onChange }) {

// Categoria com variantes por lado — leitura (resumo agregado, sem edição)
function CategoriaBPGrupoLeitura({ label, catKey, dados }) {
  const variantes = VARIANTES_BP[catKey];
  const norm = normalizarCategoriaBP(catKey, dados);
  const totais = categoriaTotaisBP(catKey, dados);
  const pct = pctBP(totais.golos, totais.total);
  const cor = corPctBP(pct);
  return (
    <div style={{ background: T.card, border: `1px solid ${T.sep}`, borderRadius: 16, padding: 14, marginBottom: 10 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
        <div style={{ fontSize: 13, fontWeight: 700 }}>{label}</div>
        <div style={{ fontSize: 12, color: T.sub }}>{totais.golos} golos / {totais.total} bolas paradas</div>
      </div>
      <div style={{ display: "flex", gap: 14, marginBottom: 8, flexWrap: "wrap" }}>
        {variantes.map((v) => {
          const pctV = pctBP(norm[v].golos, norm[v].total);
          return (
            <div key={v} style={{ fontSize: 11, color: T.sub }}>
              {LABEL_VARIANTE_BP[v]}: <span style={{ color: T.text, fontWeight: 700 }}>{norm[v].golos}/{norm[v].total}</span> <span style={{ color: corPctBP(pctV) }}>({pctV.toFixed(0)}%)</span>
            </div>
          );
        })}
      </div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
        <div style={{ fontSize: 11, color: T.sub }}>Aproveitamento</div>
        <div style={{ fontSize: 15, fontWeight: 800, color: cor }}>{pct.toFixed(1)}%</div>
      </div>
      <div style={{ height: 8, borderRadius: 4, background: T.card2, overflow: "hidden" }}>
        <div style={{ height: "100%", width: `${pct}%`, background: cor, borderRadius: 4 }} />
      </div>
    </div>
  );
}

  const totalStats = statsBPVazio();
  jogosFiltrados.forEach((g) => {
    CATEGORIAS_BP.forEach(([k]) => {
      const variantes = VARIANTES_BP[k];
      const dCat = normalizarCategoriaBP(k, g.bolasParadasStats[modo][k]);
      if (variantes) {
        variantes.forEach((v) => {
          totalStats[k][v].total += dCat[v].total || 0;
          totalStats[k][v].golos += dCat[v].golos || 0;

      } else {
        totalStats[k].total += dCat.total || 0;

      {jogosFiltrados.length === 0 ? (

function BolasParadasStatsAdversario({ opponent, opponents, games, setOpponents }) {
  const [modo, setModo] = useState("ofensiva");
  const [contraId, setContraId] = useState("");
  const stats = opponent.bolasParadasGeral || statsBPVazio();
  const statsDefScouting = opponent.bolasParadasDefensivoGeral || statsBPVazio();
  const outrosAdversarios = (opponents || []).filter((o) => o.id !== opponent.id);

  const atualizarOponente = (id, patch) => setOpponents(opponents.map((o) => (o.id === id ? { ...o, ...patch } : o)));

  // Ofensiva — editar aqui; se houver uma equipa "contra" selecionada, a diferença é aplicada
  // automaticamente à defensiva (scouting) dessa outra equipa, sem duplicar a introdução de dados.
  const atualizarOfensiva = (categoria, novosDados) => {
    const catAntiga = stats[categoria];
    const alvo = contraId ? opponents.find((o) => o.id === contraId) : null;
    if (alvo) {
      const statsDefAlvo = alvo.bolasParadasDefensivoGeral || statsBPVazio();
      const novoDefAlvo = aplicarDeltaCategoriaBP(categoria, statsDefAlvo, catAntiga, novosDados);
      setOpponents(opponents.map((o) => {
        if (o.id === opponent.id) return { ...o, bolasParadasGeral: { ...stats, [categoria]: novosDados } };
        if (o.id === contraId) return { ...o, bolasParadasDefensivoGeral: novoDefAlvo };
        return o;
      }));
    } else {
      atualizarOponente(opponent.id, { bolasParadasGeral: { ...stats, [categoria]: novosDados } });
    }
  };
  const atualizarDefensivaScouting = (categoria, novosDados) => {
    atualizarOponente(opponent.id, { bolasParadasDefensivoGeral: { ...statsDefScouting, [categoria]: novosDados } });
  };

  const ap = aproveitamentoBP(stats);
  const apDefScouting = aproveitamentoBP(statsDefScouting);

  // Defensiva "jogos contra nós" — automática, apenas informativa, a partir de jogos reais já disputados
  const jogosContraEste = (games || []).filter((g) => isTerminado(g) && g.adversarioId === opponent.id && g.bolasParadasStats?.casa);
  const statsDefJogos = statsBPVazio();
  jogosContraEste.forEach((g) => {
    CATEGORIAS_BP.forEach(([k]) => {
      const variantes = VARIANTES_BP[k];
      const dCat = normalizarCategoriaBP(k, g.bolasParadasStats.casa[k]);
      if (variantes) {
        variantes.forEach((v) => { statsDefJogos[k][v].total += dCat[v].total || 0; statsDefJogos[k][v].golos += dCat[v].golos || 0; });
      } else {
        statsDefJogos[k].total += dCat.total || 0; statsDefJogos[k].golos += dCat.golos || 0;
      }
    });
  });
  const apDefJogos = aproveitamentoBP(statsDefJogos);

  return (
    <div>
      <div style={{ display: "flex", gap: 6, marginBottom: 16 }}>
        {[["ofensiva", "⚽ Ofensiva"], ["defensiva", "🛡️ Defensiva"]].map(([k, l]) => (
          <button key={k} onClick={() => setModo(k)} style={{ flex: 1, background: modo === k ? T.text : T.card, color: modo === k ? "#000" : T.text, border: `1px solid ${T.sep}`, borderRadius: 10, padding: "9px 0", fontSize: 12, fontWeight: 700, cursor: "pointer", fontFamily: FONT }}>{l}</button>
        ))}
      </div>

      {modo === "ofensiva" ? (
        <>
          <div style={{ fontSize: 12, color: T.sub, marginBottom: 14 }}>Estatísticas gerais de {opponent.nome} nas bolas paradas — registo de scouting, não ligado a um jogo específico.</div>

          {outrosAdversarios.length > 0 && (
            <div style={{ background: T.card, border: `1px solid ${T.sep}`, borderRadius: 14, padding: 14, marginBottom: 16 }}>
              <div style={{ fontSize: 11, fontWeight: 700, color: T.sub, marginBottom: 6 }}>🔗 REGISTAR COMO SENDO CONTRA</div>
              <select value={contraId} onChange={(e) => setContraId(e.target.value)} style={inputStyle}>
                <option value="">— Nenhuma equipa (não ligar) —</option>
                {outrosAdversarios.map((o) => <option key={o.id} value={o.id}>{o.nome}</option>)}
              </select>
              {contraId && <div style={{ fontSize: 10, color: T.sub, marginTop: 6 }}>Tudo o que alterares aqui em baixo é também somado automaticamente à defensiva (scouting) de {opponents.find((o) => o.id === contraId)?.nome}.</div>}
            </div>
          )}

          {CATEGORIAS_BP.map(([k, label]) => (
            VARIANTES_BP[k]
              ? <CategoriaBPGrupo key={k} label={label} catKey={k} dados={stats[k]} onChange={(v) => atualizarOfensiva(k, v)} />
              : <CategoriaBP key={k} label={label} dados={stats[k] || categoriaVazia()} onChange={(v) => atualizarOfensiva(k, v)} />
          ))}
          <div style={{ background: T.card, border: `1px solid ${T.sep}`, borderRadius: 16, padding: 16, marginTop: 6 }}>
            <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 10 }}>🏆 Aproveitamento Total das Bolas Paradas</div>
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: T.sub, marginBottom: 8 }}>
              <span>{ap.totalBP} bolas paradas</span><span>{ap.totalGolos} golos</span>
            </div>
            <div style={{ display: "flex", justifyContent: "center", marginBottom: 8 }}>
              <div style={{ fontSize: 28, fontWeight: 900, color: corPctBP(ap.pct) }}>{ap.pct.toFixed(1)}%</div>
            </div>
            <div style={{ height: 10, borderRadius: 5, background: T.card2, overflow: "hidden" }}>
              <div style={{ height: "100%", width: `${ap.pct}%`, background: corPctBP(ap.pct), borderRadius: 5 }} />
            </div>
          </div>
        </>
      ) : (
        <>
          <div style={{ fontSize: 12, color: T.sub, marginBottom: 14 }}>Estatísticas defensivas de {opponent.nome} — também em modo scouting, editáveis diretamente. Ficam atualizadas automaticamente sempre que registares a ofensiva de outra equipa "contra" esta.</div>

          {CATEGORIAS_BP.map(([k, label]) => (
            VARIANTES_BP[k]
              ? <CategoriaBPGrupo key={k} label={`${label} Contra`} catKey={k} dados={statsDefScouting[k]} onChange={(v) => atualizarDefensivaScouting(k, v)} />
              : <CategoriaBP key={k} label={`${label} Contra`} dados={statsDefScouting[k] || categoriaVazia()} onChange={(v) => atualizarDefensivaScouting(k, v)} />
          ))}
          <div style={{ background: T.card, border: `1px solid ${T.sep}`, borderRadius: 16, padding: 16, marginTop: 6, marginBottom: 16 }}>
            <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 10 }}>🛡️ Estatística Defensiva Total (Scouting)</div>
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: T.sub, marginBottom: 8 }}>
              <span>{apDefScouting.totalBP} bolas paradas contra</span><span>{apDefScouting.totalGolos} golos sofridos</span>
            </div>
            <div style={{ display: "flex", justifyContent: "center", marginBottom: 8 }}>
              <div style={{ fontSize: 28, fontWeight: 900, color: corPctBP(apDefScouting.pct) }}>{apDefScouting.pct.toFixed(1)}%</div>
            </div>
            <div style={{ height: 10, borderRadius: 5, background: T.card2, overflow: "hidden" }}>
              <div style={{ height: "100%", width: `${apDefScouting.pct}%`, background: corPctBP(apDefScouting.pct), borderRadius: 5 }} />
            </div>
          </div>

          {jogosContraEste.length > 0 && (
            <div style={{ background: T.card2, border: `1px solid ${T.sep}`, borderRadius: 16, padding: 14 }}>
              <div style={{ fontSize: 12, fontWeight: 700, marginBottom: 4 }}>ℹ️ Só nos jogos contra a minha equipa (referência)</div>
              <div style={{ fontSize: 11, color: T.sub, marginBottom: 8 }}>Calculado à parte, apenas com base nos {jogosContraEste.length} jogo{jogosContraEste.length !== 1 ? "s" : ""} que já disputaste contra {opponent.nome} — não é somado ao scouting acima.</div>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <span style={{ fontSize: 11, color: T.sub }}>{apDefJogos.totalGolos} golos / {apDefJogos.totalBP} bolas paradas</span>
                <span style={{ fontSize: 15, fontWeight: 800, color: corPctBP(apDefJogos.pct) }}>{apDefJogos.pct.toFixed(1)}%</span>
              </div>
            </div>
          )}
        </>
      )}
    </div>
  );
}

const WELLNESS_NIVEIS = {
  sono: ["Excelente", "Muito boa", "Boa", "Razoável", "Fraca", "Má", "Muito má"],
  fadiga: ["Sem fadiga", "Quase nenhuma", "Reduzida", "Moderada", "Alguma", "Elevada", "Muito elevada"],
  dorMuscular: ["Sem dor", "Quase nenhuma", "Ligeira", "Moderada", "Alguma", "Elevada", "Muito elevada"],
  stress: ["Sem stress", "Quase nenhum", "Reduzido", "Moderado", "Algum", "Elevado", "Muito elevado"],
};
const WELLNESS_LABELS = { sono: "😴 Sono", fadiga: "🔋 Fadiga", dorMuscular: "💪 Dor Muscular", stress: "🧠 Stress" };
const ZONAS_CORPORAIS = ["Cabeça", "Pescoço", "Ombro esquerdo", "Ombro direito", "Braço esquerdo", "Braço direito", "Costas", "Zona lombar", "Abdómen", "Anca esquerda", "Anca direita", "Adutor esquerdo", "Adutor direito", "Quadríceps esquerdo", "Quadríceps direito", "Isquiotibiais esquerdos", "Isquiotibiais direitos", "Joelho esquerdo", "Joelho direito", "Gémeo esquerdo", "Gémeo direito", "Tornozelo esquerdo", "Tornozelo direito", "Pé esquerdo", "Pé direito"];
const PSE_TIPOS = ["Treino", "Jogo", "Recuperação", "Ginásio", "Sessão Individual", "Reabilitação", "Complementar", "Outro"];
const PSE_NIVEIS = ["Repouso", "Muito leve", "Leve", "Moderado", "Algo intenso", "Intenso", "Intenso", "Muito intenso", "Muito intenso", "Extremo", "Máximo"];

function calcWellnessTotal(e) { return (e.sono || 0) + (e.fadiga || 0) + (e.dorMuscular || 0) + (e.stress || 0); }
function classificarWellness(total) {
  if (total <= 10) return { label: "Muito bom", color: "#30D158" };
  if (total <= 16) return { label: "Bom", color: "#64D2FF" };
  if (total <= 22) return { label: "Atenção", color: "#FFD60A" };
  return { label: "Risco elevado", color: "#FF453A" };
}
function calcCarga(duracao, pse) { return (Number(duracao) || 0) * (Number(pse) || 0); }
function hojeISO() { return new Date().toISOString().slice(0, 10); }
function upsertEntry(lista, jogadorId, data, patch, autor) {
  const idx = lista.findIndex((e) => e.jogadorId === jogadorId && e.data === data);
  if (idx >= 0) { const novo = [...lista]; novo[idx] = { ...novo[idx], ...patch, atualizadoEm: new Date().toISOString(), ...(autor ? { atualizadoPor: autor } : {}) }; return novo; }
  return [...lista, { id: uid(), jogadorId, data, ...patch, criadoEm: new Date().toISOString(), ...(autor ? { criadoPor: autor, atualizadoPor: autor } : {}) }];
}
function statusAtleta(wellnessEntry) {
  if (!wellnessEntry) return { label: "Sem dados", color: T.sub };
  const total = calcWellnessTotal(wellnessEntry);
  const nota = wellnessEntry.notaGeral;
  if (total >= 23 || (nota != null && nota <= 3)) return { label: "Risco elevado", color: "#FF453A" };
  if (total >= 17 || (nota != null && nota <= 5)) return { label: "Atenção", color: "#FFD60A" };
  return { label: "Disponível", color: "#30D158" };
}

const PERIODO_PRESETS = [["hoje", "Hoje"], ["ontem", "Ontem"], ["7dias", "Últ. 7 dias"], ["30dias", "Últ. 30 dias"], ["semana", "Semana Atual"], ["mes", "Mês Atual"], ["custom", "Personalizado"]];
function isoData(d) { return d.toISOString().slice(0, 10); }
function addDias(d, n) { const c = new Date(d); c.setDate(c.getDate() + n); return c; }
function calcularIntervalo(preset, custom) {
  const hoje = new Date();
  switch (preset) {
    case "hoje": return { inicio: isoData(hoje), fim: isoData(hoje) };
    case "ontem": { const o = addDias(hoje, -1); return { inicio: isoData(o), fim: isoData(o) }; }
    case "7dias": return { inicio: isoData(addDias(hoje, -6)), fim: isoData(hoje) };
    case "30dias": return { inicio: isoData(addDias(hoje, -29)), fim: isoData(hoje) };
    case "semana": { const dow = hoje.getDay() || 7; return { inicio: isoData(addDias(hoje, -(dow - 1))), fim: isoData(hoje) }; }
    case "mes": return { inicio: isoData(new Date(hoje.getFullYear(), hoje.getMonth(), 1)), fim: isoData(hoje) };
    case "custom": return custom;
    default: return { inicio: isoData(hoje), fim: isoData(hoje) };
  }
}
function periodoLabel(preset, intervalo) {
  const opt = PERIODO_PRESETS.find((p) => p[0] === preset);
  if (preset !== "custom") return intervalo.inicio === intervalo.fim ? intervalo.inicio : `${opt[1]} (${intervalo.inicio} a ${intervalo.fim})`;
  return `${intervalo.inicio} a ${intervalo.fim}`;
}
function SeletorPeriodo({ preset, setPreset, custom, setCustom }) {
  return (
    <div style={{ marginBottom: 16 }}>
      <div style={{ display: "flex", gap: 6, overflowX: "auto", paddingBottom: 6 }}>
        {PERIODO_PRESETS.map(([k, l]) => (
          <button key={k} onClick={() => setPreset(k)} style={{ whiteSpace: "nowrap", background: preset === k ? T.text : T.card, color: preset === k ? "#000" : T.text, border: `1px solid ${T.sep}`, borderRadius: 10, padding: "6px 12px", fontSize: 12, fontWeight: 700, cursor: "pointer", fontFamily: FONT }}>{l}</button>
        ))}
      </div>
      {preset === "custom" && (
        <div style={{ display: "flex", gap: 8, alignItems: "center", marginTop: 8 }}>
          <input type="date" value={custom.inicio} onChange={(e) => setCustom({ ...custom, inicio: e.target.value })} style={{ ...inputStyle, width: "auto" }} />
          <span style={{ color: T.sub, fontSize: 12 }}>até</span>
          <input type="date" value={custom.fim} onChange={(e) => setCustom({ ...custom, fim: e.target.value })} style={{ ...inputStyle, width: "auto" }} />
        </div>
      )}
    </div>
  );
}
function agregarWellnessPorAtleta(jogadorId, entries) {
  const doAtleta = entries.filter((e) => e.jogadorId === jogadorId);
  if (!doAtleta.length) return null;
  const media = (fn) => Math.round((doAtleta.reduce((s, e) => s + fn(e), 0) / doAtleta.length) * 10) / 10;
  return {
    registos: doAtleta.length,
    sono: media((e) => e.sono || 0), fadiga: media((e) => e.fadiga || 0), dorMuscular: media((e) => e.dorMuscular || 0), stress: media((e) => e.stress || 0),
    total: media((e) => calcWellnessTotal(e)), notaGeral: media((e) => e.notaGeral || 0),
    observacoes: doAtleta.filter((e) => e.observacoes).length,
  };
}
function agregarPSEPorAtleta(jogadorId, entries) {
  const doAtleta = entries.filter((e) => e.jogadorId === jogadorId);
  if (!doAtleta.length) return null;
  const duracaoTotal = doAtleta.reduce((s, e) => s + (Number(e.duracao) || 0), 0);
  const cargaTotal = doAtleta.reduce((s, e) => s + calcCarga(e.duracao, e.pse), 0);
  const pseMedia = Math.round((doAtleta.reduce((s, e) => s + (e.pse || 0), 0) / doAtleta.length) * 10) / 10;
  return { registos: doAtleta.length, duracaoTotal, pseMedia, cargaTotal, observacoes: doAtleta.filter((e) => e.observacoes).length };
}

              <select value={e.tipoSessao || "Treino"} onChange={(ev) => update(p.id, { tipoSessao: ev.target.value })} style={{ ...inputStyle, width: 160 }}>{PSE_TIPOS.map((t) => <option key={t} value={t}>{t}</option>)}</select>

            </div>
            <div style={{ marginBottom: 8 }}>
              <div style={{ fontSize: 10, color: T.sub, marginBottom: 4, fontWeight: 700 }}>PSE (0–10){e.pse != null ? ` · ${PSE_NIVEIS[e.pse]}` : ""}</div>

                {Array.from({ length: 11 }, (_, n) => (
                  <span key={n} onClick={() => update(p.id, { pse: n })} style={{ fontSize: 10, fontWeight: e.pse === n ? 800 : 600, color: e.pse === n ? T.text : T.sub, cursor: "pointer", width: 16, textAlign: "center" }}>{n}</span>
                ))}
              </div>
            </div>
            <button onClick={() => setObsAberta(obsAberta === p.id ? null : p.id)} style={{ background: "none", border: "none", color: "#0A84FF", fontSize: 12, fontWeight: 700, cursor: "pointer", fontFamily: FONT, padding: 0 }}>{e.observacoes ? "📝 Editar observações" : "+ Observações"}</button>
            {obsAberta === p.id && <textarea value={e.observacoes || ""} onChange={(ev) => update(p.id, { observacoes: ev.target.value })} rows={2} style={{ ...inputStyle, marginTop: 8, resize: "vertical" }} placeholder="Observações" />}
          </div>
        );
      })}
    </>
  );
}

function HistoricoFisico({ players, wellnessEntries, pseEntries, accent }) {
  const [jogadorId, setJogadorId] = useState(players[0]?.id || null);
  const jogador = players.find((p) => p.id === jogadorId);
  const [preset, setPreset] = useState("30dias");
  const [custom, setCustom] = useState({ inicio: hojeISO(), fim: hojeISO() });
  const intervalo = calcularIntervalo(preset, custom);
  const historico = useMemo(() => {
    const dentro = (d) => d >= intervalo.inicio && d <= intervalo.fim;
    const datas = new Set([
      ...wellnessEntries.filter((e) => e.jogadorId === jogadorId && dentro(e.data)).map((e) => e.data),
      ...pseEntries.filter((e) => e.jogadorId === jogadorId && dentro(e.data)).map((e) => e.data),
    ]);
    return Array.from(datas).sort((a, b) => b.localeCompare(a)).map((data) => ({
      data, w: wellnessEntries.find((e) => e.jogadorId === jogadorId && e.data === data), p: pseEntries.find((e) => e.jogadorId === jogadorId && e.data === data),
    }));
  }, [jogadorId, wellnessEntries, pseEntries, intervalo.inicio, intervalo.fim]);

  return (
    <>
      <SeletorPeriodo preset={preset} setPreset={setPreset} custom={custom} setCustom={setCustom} />
      <div style={{ display: "flex", gap: 8, overflowX: "auto", paddingBottom: 8, marginBottom: 16 }}>
        {players.map((p) => (
          <div key={p.id} onClick={() => setJogadorId(p.id)} style={{ flexShrink: 0, textAlign: "center", cursor: "pointer" }}>
            <div style={{ borderRadius: "50%", border: jogadorId === p.id ? `2px solid ${T.warning}` : "2px solid transparent" }}><Avatar label={initials(p.nome)} photo={p.foto} size={44} bg={accent} /></div>
            <div style={{ fontSize: 9, color: T.sub, marginTop: 3, maxWidth: 50, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{p.nome?.split(" ")[0]}</div>
          </div>
        ))}
      </div>
      {historico.length === 0 && <div style={{ textAlign: "center", color: T.sub, padding: 30, fontSize: 14 }}>Ainda sem registos para {jogador?.nome}.</div>}
      {historico.map(({ data, w, p }) => (
        <div key={data} style={{ background: T.card, border: `1px solid ${T.sep}`, borderRadius: 12, padding: "10px 14px", marginBottom: 8, fontSize: 12 }}>
          <div style={{ fontWeight: 700, marginBottom: 4 }}>{data}</div>
          <div style={{ display: "flex", gap: 16, flexWrap: "wrap", color: T.sub }}>
            {w && <span>Wellness: <b style={{ color: T.text }}>{calcWellnessTotal(w)}/28</b></span>}
            {w?.notaGeral != null && <span>Nota: <b style={{ color: T.text }}>{w.notaGeral}/10</b></span>}
            {p && <span>PSE: <b style={{ color: T.text }}>{p.pse}</b> · Carga: <b style={{ color: T.text }}>{calcCarga(p.duracao, p.pse)} UA</b></span>}
          </div>
          {(w?.observacoes || p?.observacoes) && <div style={{ marginTop: 6, fontSize: 11, color: T.sub }}>📝 {w?.observacoes || p?.observacoes}</div>}
        </div>
      ))}
    </>
  );
}

}

function RelatorioIndividualFisico({ club, jogador, todasWellness, todasPSE, wellnessPeriodo, psePeriodo, periodoTexto, responsavel, accent, onVoltar }) {
  const exportarPDF = () => { if (window.exportarRelatorioPDFBlocos) window.exportarRelatorioPDFBlocos(`Individual_${jogador.nome.replace(/\\s+/g, "_")}.pdf`); else window.print(); };
  const agW = wellnessPeriodo.length ? agregarWellnessPorAtleta(jogador.id, wellnessPeriodo) : null;
  const agP = psePeriodo.length ? agregarPSEPorAtleta(jogador.id, psePeriodo) : null;
  const clsW = agW ? classificarWellness(agW.total) : null;
  const melhorW = wellnessPeriodo.length ? Math.min(...wellnessPeriodo.map((e) => calcWellnessTotal(e))) : null;
  const piorW = wellnessPeriodo.length ? Math.max(...wellnessPeriodo.map((e) => calcWellnessTotal(e))) : null;

  // Comparação: média de toda a época (todos os registos deste atleta, fora deste período) vs período selecionado
  const wellnessEpoca = todasWellness.filter((e) => e.jogadorId === jogador.id);
  const agWEpoca = wellnessEpoca.length ? agregarWellnessPorAtleta(jogador.id, wellnessEpoca) : null;
  const pseEpoca = todasPSE.filter((e) => e.jogadorId === jogador.id);
  const agPEpoca = pseEpoca.length ? agregarPSEPorAtleta(jogador.id, pseEpoca) : null;

  const observacoes = [
    ...wellnessPeriodo.filter((e) => e.observacoes).map((e) => ({ data: e.data, texto: e.observacoes, tipo: "Wellness" })),
    ...psePeriodo.filter((e) => e.observacoes).map((e) => ({ data: e.data, texto: e.observacoes, tipo: "PSE" })),
  ].sort((a, b) => b.data.localeCompare(a.data));

  const linhaComparacao = (label, valorPeriodo, valorEpoca, unidade = "") => {
    if (valorPeriodo == null || valorEpoca == null) return null;
    const diff = Math.round((valorPeriodo - valorEpoca) * 10) / 10;
    const cor = diff > 0 ? "#2a8a4a" : diff < 0 ? "#b8342f" : "#888";
    return (
      <tr>
        <td style={{ padding: 6, color: "#666" }}>{label}</td>
        <td style={{ padding: 6, textAlign: "right", fontWeight: 700 }}>{valorPeriodo}{unidade}</td>
        <td style={{ padding: 6, textAlign: "right", color: "#888" }}>{valorEpoca}{unidade}</td>
        <td style={{ padding: 6, textAlign: "right", fontWeight: 700, color: cor }}>{diff > 0 ? "+" : ""}{diff}{unidade}</td>
      </tr>
    );
  };

  return (
    <div style={{ maxWidth: 760, margin: "0 auto" }}>
      <style>{`@media print { body * { visibility: hidden; } #report-paper, #report-paper * { visibility: visible; } #report-paper { position: absolute; top: 0; left: 0; width: 100%; } }`}</style>
      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 12 }}>
        <GhostBtn onClick={onVoltar}>‹ Condição Física</GhostBtn>
        <button onClick={exportarPDF} style={{ background: T.text, color: "#000", border: "none", borderRadius: 12, padding: "10px 18px", fontSize: 13, fontWeight: 700, fontFamily: FONT, cursor: "pointer" }}>Exportar PDF</button>
      </div>
      <div id="report-paper" style={{ background: "#FFFFFF", color: "#111", borderRadius: 18, padding: 24, marginBottom: 24, overflow: "hidden", boxShadow: "0 20px 60px rgba(0,0,0,0.35)" }}>
        <div className="pdf-block">
          <div style={{ textAlign: "center", marginBottom: 20 }}><ReportLogo size={32} /></div>
          <div style={{ background: "linear-gradient(135deg, #111111, #B9873B)", borderRadius: 16, padding: "18px 24px", color: "#fff", marginBottom: 20 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
              <div style={{ width: 50, height: 50, borderRadius: 25, background: "#fff", overflow: "hidden", flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center" }}>
                {jogador.foto ? <div style={{ width: "100%", height: "100%", backgroundImage: `url(${jogador.foto})`, backgroundSize: "cover", backgroundPosition: "center" }} /> : <span style={{ color: "#111", fontWeight: 800 }}>{initials(jogador.nome)}</span>}
              </div>
              <div>
                <div style={{ fontSize: 18, fontWeight: 800 }}>{jogador.nome}</div>
                <div style={{ fontSize: 11, opacity: 0.85 }}>#{jogador.numero || "-"} · {jogador.posicao} · {club.nome}</div>
              </div>
            </div>
            <div style={{ fontSize: 11, opacity: 0.85, marginTop: 8 }}>{periodoTexto}{responsavel ? ` · Responsável: ${responsavel}` : ""}</div>
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 8 }}>
            {[["Wellness Médio", agW ? `${agW.total}/28` : "-"], ["Nota Média", agW ? `${agW.notaGeral}/10` : "-"], ["PSE Médio", agP ? `${agP.pseMedia}/10` : "-"], ["Carga Total", agP ? `${agP.cargaTotal} UA` : "-"]].map(([label, val]) => (

                {agW ? (
                  <>
                    <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 8, marginBottom: 10 }}>
                      {[["Sono", agW.sono], ["Fadiga", agW.fadiga], ["Dor Muscular", agW.dorMuscular], ["Stress", agW.stress]].map(([l, v]) => (
                        <div key={l} style={{ textAlign: "center" }}><div style={{ fontSize: 14, fontWeight: 800 }}>{v}</div><div style={{ fontSize: 8, color: "#888", textTransform: "uppercase" }}>{l}</div></div>

                    <div style={{ display: "flex", justifyContent: "space-between", fontSize: 11, color: "#555", borderTop: "1px solid #e5e5e5", paddingTop: 8 }}>
                      <span>Estado: <b style={{ color: clsW.color }}>{clsW.label}</b></span>
                      <span>Melhor dia: <b>{melhorW}/28</b> · Pior dia: <b>{piorW}/28</b></span>

                    </div>
                  </>
                ) : <div style={{ color: "#999" }}>Sem registos de wellness neste período.</div>}
              </div>
            </div>

            <div className="pdf-block" style={{ marginTop: 20 }}>
              <div style={{ fontSize: 14, fontWeight: 800, color: "#111", borderLeft: "4px solid #111", paddingLeft: 10, marginBottom: 14 }}>🏋️ PSE &amp; Carga do Período</div>

                {agP ? (
                  <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 8 }}>
                    {[["Sessões", agP.registos], ["Duração Total", `${agP.duracaoTotal}'`], ["PSE Médio", agP.pseMedia], ["Carga Total", `${agP.cargaTotal} UA`]].map(([l, v]) => (
                      <div key={l} style={{ textAlign: "center" }}><div style={{ fontSize: 14, fontWeight: 800 }}>{v}</div><div style={{ fontSize: 8, color: "#888", textTransform: "uppercase" }}>{l}</div></div>
                    ))}
                  </div>
                ) : <div style={{ color: "#999" }}>Sem registos de PSE neste período.</div>}
              </div>
            </div>

            {(agWEpoca || agPEpoca) && (

                <div style={{ border: "1px solid #eee", borderRadius: 12, overflow: "hidden" }}>

                    <tbody>

                      {agW && agWEpoca && linhaComparacao("Nota Geral", agW.notaGeral, agWEpoca.notaGeral, "/10")}
                      {agP && agPEpoca && linhaComparacao("PSE Médio", agP.pseMedia, agPEpoca.pseMedia, "/10")}
                      {agP && agPEpoca && linhaComparacao("Carga Média/Sessão", Math.round((agP.cargaTotal / agP.registos) * 10) / 10, Math.round((agPEpoca.cargaTotal / agPEpoca.registos) * 10) / 10, " UA")}
                    </tbody>

            {observacoes.length > 0 && (
              <div className="pdf-block" style={{ marginTop: 20 }}>
                <div style={{ fontSize: 14, fontWeight: 800, color: "#111", borderLeft: "4px solid #111", paddingLeft: 10, marginBottom: 14 }}>📝 Observações</div>

          <div style={{ fontSize: 9, color: "#999", marginTop: 8 }}>Relatório gerado em {new Date().toLocaleDateString("pt-PT")}</div>
        </div>
      </div>
    </div>
  );
}

const CLIP_CATEGORIAS = ["Golo", "Assistência", "Remate", "Bola Parada", "Organização Ofensiva", "Organização Defensiva", "Transição Ofensiva", "Transição Defensiva", "Pressão", "Construção", "Erro Individual", "Outro"];
const CORES_DESENHO = ["#FF3B30", "#FFD60A", "#30D158", "#0A84FF", "#BF5AF2", "#FFFFFF", "#111111"];
function formatTempo(s) {
  if (s == null || isNaN(s) || s < 0) return "00:00";
  const m = Math.floor(s / 60), sec = Math.floor(s % 60);
  return `${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
}
function parseTempoInput(txt) {
  const partes = String(txt).split(":").map((x) => parseInt(x, 10) || 0);
  if (partes.length === 2) return partes[0] * 60 + partes[1];
  return partes[0] || 0;
}
function parseYouTubeId(url) {
  if (!url) return null;
  const m = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{6,})/);
  return m ? m[1] : null;
}

function DrawingCanvas({ largura, altura, shapes, setShapes, ferramenta, cor, espessura, fundo, transparente }) {
  const svgRef = useRef(null);
  const [atual, setAtual] = useState(null);
  const posSVG = (e) => {
    const rect = svgRef.current.getBoundingClientRect();
    return { x: ((e.clientX - rect.left) / rect.width) * 100, y: ((e.clientY - rect.top) / rect.height) * 100 };
  };
  const iniciar = (e) => {
    if (!ferramenta) return;
    const p = posSVG(e);
    if (ferramenta === "texto") {
      const texto = prompt("Texto:");
      if (texto) setShapes((prev) => [...prev, { id: uid(), tool: "texto", x: p.x, y: p.y, texto, cor, espessura }]);
      return;
    }
    if (ferramenta === "holofote") {
      setShapes((prev) => [...prev, { id: uid(), tool: "holofote", x: p.x, y: p.y, raio: 12 }]);
      return;
    }
    setAtual({ id: uid(), tool: ferramenta, cor, espessura, x1: p.x, y1: p.y, x2: p.x, y2: p.y, pontos: [p] });
  };
  const mover = (e) => {
    if (!atual) return;
    const p = posSVG(e);
    if (ferramenta === "livre") setAtual((prev) => ({ ...prev, pontos: [...prev.pontos, p] }));
    else setAtual((prev) => ({ ...prev, x2: p.x, y2: p.y }));
  };
  const soltar = () => { if (atual) { setShapes((prev) => [...prev, atual]); setAtual(null); } };
  const desenhar = (s) => {
    if (s.tool === "seta" || s.tool === "linha") {
      const marker = s.tool === "seta" ? `url(#seta-${s.cor.replace("#", "")})` : undefined;
      return <line key={s.id} x1={s.x1} y1={s.y1} x2={s.x2} y2={s.y2} stroke={s.cor} strokeWidth={s.espessura} markerEnd={marker} />;
    }
    if (s.tool === "circulo") { const r = Math.hypot(s.x2 - s.x1, s.y2 - s.y1); return <circle key={s.id} cx={s.x1} cy={s.y1} r={r} fill="none" stroke={s.cor} strokeWidth={s.espessura} />; }
    if (s.tool === "retangulo") return <rect key={s.id} x={Math.min(s.x1, s.x2)} y={Math.min(s.y1, s.y2)} width={Math.abs(s.x2 - s.x1)} height={Math.abs(s.y2 - s.y1)} fill="none" stroke={s.cor} strokeWidth={s.espessura} />;
    if (s.tool === "livre") return <polyline key={s.id} points={s.pontos.map((p) => `${p.x},${p.y}`).join(" ")} fill="none" stroke={s.cor} strokeWidth={s.espessura} strokeLinecap="round" strokeLinejoin="round" />;
    if (s.tool === "texto") return <text key={s.id} x={s.x} y={s.y} fill={s.cor} fontSize={3 + s.espessura} fontWeight={800} style={{ filter: "drop-shadow(0 1px 2px rgba(0,0,0,0.8))" }}>{s.texto}</text>;
    return null;
  };
  return (
    <div style={transparente
      ? { position: "absolute", inset: 0, touchAction: "none" }
      : { position: "relative", width: largura, height: altura, background: fundo ? `url(${fundo})` : "#000", backgroundSize: "cover", backgroundPosition: "center", borderRadius: 10, overflow: "hidden", touchAction: "none" }}>
      {shapes.filter((s) => s.tool === "holofote").map((s) => (
        <div key={s.id} style={{ position: "absolute", left: `${s.x}%`, top: `${s.y}%`, width: `${s.raio}%`, aspectRatio: "1", transform: "translate(-50%,-50%)", borderRadius: "50%", boxShadow: "0 0 0 2000px rgba(0,0,0,0.65)", border: "2px solid rgba(255,255,255,0.8)", pointerEvents: "none" }} />
      ))}
      <svg ref={svgRef} viewBox="0 0 100 100" preserveAspectRatio="none" style={{ position: "absolute", inset: 0, width: "100%", height: "100%", cursor: ferramenta ? "crosshair" : "default" }}
        onPointerDown={iniciar} onPointerMove={mover} onPointerUp={soltar} onPointerLeave={soltar}>
        <defs>{CORES_DESENHO.map((c) => (
          <marker key={c} id={`seta-${c.replace("#", "")}`} markerWidth="4" markerHeight="4" refX="3" refY="2" orient="auto"><path d="M0,0 L4,2 L0,4 Z" fill={c} /></marker>
        ))}</defs>
        {shapes.filter((s) => s.tool !== "holofote").map(desenhar)}
        {atual && desenhar(atual)}
      </svg>
    </div>
  );
}

function ControlosVideo({ playing, currentTime, duration, onPlayPause, onSeekRel, onSeekAbs, speed, onSpeed, precisao }) {
  return (
    <div style={{ background: T.card2, borderRadius: 12, padding: "10px 12px" }}>
      <input type="range" min={0} max={duration || 0} step={0.1} value={currentTime} onChange={(e) => onSeekAbs(Number(e.target.value))} style={{ width: "100%", marginBottom: 8 }} />
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 8 }}>
        <div style={{ fontSize: 12, color: T.sub, fontWeight: 700, minWidth: 90 }}>{formatTempo(currentTime)} / {formatTempo(duration)}</div>
        <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
          <button onClick={() => onSeekRel(-10)} style={ctrlBtnStyle}>-10s</button>
          <button onClick={() => onSeekRel(-5)} style={ctrlBtnStyle}>-5s</button>
          {precisao && <button onClick={() => onSeekRel(-1 / 30)} style={ctrlBtnStyle}>⏮︎</button>}
          <button onClick={onPlayPause} style={{ ...ctrlBtnStyle, background: T.text, color: "#000", padding: "6px 16px" }}>{playing ? "⏸" : "▶️"}</button>
          {precisao && <button onClick={() => onSeekRel(1 / 30)} style={ctrlBtnStyle}>⏭︎</button>}
          <button onClick={() => onSeekRel(5)} style={ctrlBtnStyle}>+5s</button>
          <button onClick={() => onSeekRel(10)} style={ctrlBtnStyle}>+10s</button>
        </div>
        <select value={speed} onChange={(e) => onSpeed(Number(e.target.value))} style={{ ...inputStyle, width: "auto", padding: "6px 8px", fontSize: 12 }}>
          {[0.25, 0.5, 0.75, 1, 1.25, 1.5, 2].map((v) => <option key={v} value={v}>{v}x</option>)}
        </select>
      </div>
    </div>
  );
}
const ctrlBtnStyle = { background: T.card, border: `1px solid ${T.sep}`, color: T.text, borderRadius: 8, padding: "6px 10px", fontSize: 12, fontWeight: 700, cursor: "pointer", fontFamily: FONT };

function VideoProjectView({ club, players, games, opponents, projeto, setProjeto, videoUrlLocal, onEscolherFicheiro, onVoltar }) {
  const videoRef = useRef(null);
  const iframeRef = useRef(null);
  const [currentTime, setCurrentTime] = useState(0);
  const [duration, setDuration] = useState(0);
  const [playing, setPlaying] = useState(false);
  const [speed, setSpeedState] = useState(1);
  const [marcaInicio, setMarcaInicio] = useState(null);
  const [formClip, setFormClip] = useState(null);
  const [anotandoClip, setAnotandoClip] = useState(null);
  const [modoAnotacao, setModoAnotacao] = useState(false);
  const [shapesAoVivo, setShapesAoVivo] = useState([]);
  const [editandoCapturaId, setEditandoCapturaId] = useState(null);
  const [ferramenta, setFerramenta] = useState("seta");
  const [cor, setCor] = useState(CORES_DESENHO[0]);
  const [espessura, setEspessura] = useState(1.2);
  const [busca, setBusca] = useState("");
  const [filtroCategoria, setFiltroCategoria] = useState("");
  const [offset, setOffset] = useState(projeto.offsetSegundos || 0);

  const isYouTube = projeto.tipo === "youtube";
  const ytId = isYouTube ? parseYouTubeId(projeto.url) : null;
  const jogo = games?.find((g) => g.id === projeto.jogoId);
  const adversarioJogo = jogo ? opponents?.find((o) => o.id === jogo.adversarioId) : null;
  const clipes = projeto.clipes || [];

  const enviarComando = (func, args = []) => { if (iframeRef.current) iframeRef.current.contentWindow.postMessage(JSON.stringify({ event: "command", func, args }), "*"); };
  const playPause = () => { if (isYouTube) { enviarComando(playing ? "pauseVideo" : "playVideo"); setPlaying(!playing); } else { if (playing) videoRef.current.pause(); else videoRef.current.play(); } };
  const seekAbs = (t) => { const novo = Math.max(0, t); setCurrentTime(novo); if (isYouTube) enviarComando("seekTo", [novo, true]); else if (videoRef.current) videoRef.current.currentTime = novo; };
  const seekRel = (d) => seekAbs(currentTime + d);
  const setSpeed = (v) => { setSpeedState(v); if (isYouTube) enviarComando("setPlaybackRate", [v]); else if (videoRef.current) videoRef.current.playbackRate = v; };

  useEffect(() => {
    if (!isYouTube) return;
    const t = setInterval(() => { if (playing) setCurrentTime((c) => c + 0.5); }, 500);
    return () => clearInterval(t);
  }, [isYouTube, playing]);

  const atualizar = (patch) => setProjeto({ ...projeto, ...patch });
  const setClipes = (novos) => atualizar({ clipes: novos });
  const guardarClip = (dados) => {
    if (dados.id) setClipes(clipes.map((c) => (c.id === dados.id ? dados : c)));
    else setClipes([...clipes, { ...dados, id: uid(), criadoEm: new Date().toISOString() }]);
    setFormClip(null);
  };
  const removerClip = (id) => setClipes(clipes.filter((c) => c.id !== id));

  const capturas = projeto.capturas || [];
  const setCapturas = (novas) => atualizar({ capturas: novas });
  const guardarCaptura = (dados) => {
    if (dados.id) setCapturas(capturas.map((c) => (c.id === dados.id ? dados : c)));
    else setCapturas([...capturas, { ...dados, id: uid(), criadoEm: new Date().toISOString() }]);
    setEditandoCapturaId(null);
  };
  const removerCaptura = (id) => setCapturas(capturas.filter((c) => c.id !== id));
  const capturaEmEdicao = capturas.find((c) => c.id === editandoCapturaId);

  const capturarFrame = () => {
    if (isYouTube || !videoRef.current) return null;
    const video = videoRef.current;
    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth || 640; canvas.height = video.videoHeight || 360;
    canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
    return canvas.toDataURL("image/jpeg", 0.85);
  };

  const iniciarAnotacaoAoVivo = () => {
    if (!isYouTube && videoRef.current) videoRef.current.pause();
    if (isYouTube) enviarComando("pauseVideo");
    setShapesAoVivo([]);
    setModoAnotacao(true);
  };
  const guardarAnotacaoAoVivo = () => {
    guardarCaptura({ nome: "Anotação", anotacoes: shapesAoVivo, capa: capturarFrame() });
    setModoAnotacao(false); setShapesAoVivo([]);
  };
  const cancelarAnotacaoAoVivo = () => { setModoAnotacao(false); setShapesAoVivo([]); };

  const clipesFiltrados = clipes.filter((c) => (!filtroCategoria || c.categoria === filtroCategoria) && (!busca || c.nome.toLowerCase().includes(busca.toLowerCase()) || (c.etiquetas || []).some((e) => e.toLowerCase().includes(busca.toLowerCase()))));
  const eventosJogo = jogo ? (jogo.actions || []).filter((a) => a.minuto != null) : [];
  const clipEmAnotacao = clipes.find((c) => c.id === anotandoClip);

  if (projeto.tipo === "local" && !videoUrlLocal) {
    return (
      <div style={{ maxWidth: 500, margin: "60px auto", textAlign: "center" }}>
        <div style={{ fontSize: 15, fontWeight: 700, marginBottom: 8 }}>🎬 {projeto.nome}</div>
        <div style={{ fontSize: 12, color: T.sub, marginBottom: 16 }}>Este projeto usa um vídeo do teu dispositivo. Como o ficheiro não fica guardado na conta (só os clipes e anotações), volta a escolher o mesmo vídeo para continuar.</div>
        <input type="file" accept="video/*" onChange={(e) => e.target.files[0] && onEscolherFicheiro(e.target.files[0])} style={{ display: "none" }} id="reescolher-video" />
        <label htmlFor="reescolher-video"><PrimaryBtn>Escolher Vídeo</PrimaryBtn></label>
        <div style={{ marginTop: 16 }}><GhostBtn onClick={onVoltar}>‹ Voltar</GhostBtn></div>
      </div>
    );
  }

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
        <GhostBtn onClick={onVoltar}>‹ Análise de Vídeo</GhostBtn>
        <div style={{ textAlign: "right" }}>
          <div style={{ fontSize: 14, fontWeight: 700 }}>{projeto.nome}</div>
          {jogo && <div style={{ fontSize: 11, color: T.sub }}>{club.nome} vs {adversarioJogo?.nome || "Adversário"} · {jogo.data}</div>}
        </div>
      </div>

      <div style={{ background: "#000", borderRadius: 14, overflow: "hidden", position: "relative", width: "100%", aspectRatio: "16/9", marginBottom: 10 }}>
        {isYouTube ? (
          ytId ? <iframe ref={iframeRef} src={`https://www.youtube.com/embed/${ytId}?enablejsapi=1&playsinline=1`} style={{ width: "100%", height: "100%", border: "none" }} allow="autoplay; encrypted-media" title="video" />
            : <div style={{ display: "flex", alignItems: "center", justifyContent: "center", height: "100%", color: T.sub, fontSize: 13 }}>Link do YouTube inválido</div>
        ) : (
          <video ref={videoRef} src={videoUrlLocal} style={{ width: "100%", height: "100%", display: "block" }}
            onTimeUpdate={(e) => setCurrentTime(e.target.currentTime)} onLoadedMetadata={(e) => setDuration(e.target.duration)}
            onPlay={() => setPlaying(true)} onPause={() => setPlaying(false)} />
        )}
        {modoAnotacao && (
          <DrawingCanvas transparente shapes={shapesAoVivo} setShapes={setShapesAoVivo} ferramenta={ferramenta} cor={cor} espessura={espessura} />
        )}
      </div>

      {modoAnotacao ? (
        <div style={{ background: T.card2, borderRadius: 12, padding: 12, marginBottom: 10 }}>
          <div style={{ fontSize: 11, fontWeight: 700, color: T.sub, marginBottom: 8 }}>🎨 A desenhar sobre o vídeo — escolhe uma ferramenta e desenha diretamente na imagem acima</div>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 10 }}>
            {[["seta", "↗️"], ["linha", "／"], ["circulo", "⭕"], ["retangulo", "▭"], ["livre", "✏️"], ["texto", "🅣"], ["holofote", "🔦"]].map(([k, icon]) => (
              <button key={k} onClick={() => setFerramenta(k)} style={{ background: ferramenta === k ? T.text : T.card, color: ferramenta === k ? "#000" : T.text, border: `1px solid ${T.sep}`, borderRadius: 8, padding: "6px 10px", fontSize: 14, cursor: "pointer" }}>{icon}</button>
            ))}
            <button onClick={() => setShapesAoVivo([])} style={{ ...ctrlBtnStyle, color: T.danger }}>Limpar</button>
            <button onClick={() => setShapesAoVivo((prev) => prev.slice(0, -1))} style={ctrlBtnStyle}>↩︎ Desfazer</button>
          </div>
          <div style={{ display: "flex", gap: 6, alignItems: "center", marginBottom: 12 }}>
            {CORES_DESENHO.map((c) => <div key={c} onClick={() => setCor(c)} style={{ width: 22, height: 22, borderRadius: 11, background: c, cursor: "pointer", border: cor === c ? `2px solid ${T.warning}` : "2px solid rgba(255,255,255,0.3)" }} />)}
            <input type="range" min="0.5" max="3" step="0.1" value={espessura} onChange={(e) => setEspessura(Number(e.target.value))} style={{ flex: 1, marginLeft: 8 }} />
          </div>
          <div style={{ display: "flex", gap: 10 }}>
            <GhostBtn onClick={cancelarAnotacaoAoVivo}>Cancelar</GhostBtn>
            <PrimaryBtn onClick={guardarAnotacaoAoVivo}>Guardar Anotação</PrimaryBtn>
          </div>
        </div>
      ) : (
        <ControlosVideo playing={playing} currentTime={currentTime} duration={duration} onPlayPause={playPause} onSeekRel={seekRel} onSeekAbs={seekAbs} speed={speed} onSpeed={setSpeed} precisao={!isYouTube} />
      )}
      {isYouTube && !modoAnotacao && <div style={{ fontSize: 10, color: T.sub, marginTop: 6, textAlign: "center" }}>Vídeo do YouTube — o tempo apresentado é aproximado (o YouTube não permite leitura exata a partir daqui).</div>}

      {!modoAnotacao && (
        <button onClick={iniciarAnotacaoAoVivo} style={{ width: "100%", marginTop: 14, background: T.text, border: "none", borderRadius: 12, padding: "12px 0", fontSize: 13, fontWeight: 700, color: "#000", cursor: "pointer", fontFamily: FONT }}>🎨 Anotar Sobre o Vídeo</button>
      )}
      {isYouTube && !modoAnotacao && <div style={{ fontSize: 10, color: T.sub, marginTop: 6, textAlign: "center" }}>Em vídeos do YouTube, a captura da imagem de fundo não é possível (limitação do YouTube) — o desenho fica guardado, mas sem imagem do fotograma.</div>}

      {jogo && eventosJogo.length > 0 && (
        <div style={{ marginTop: 16 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
            <div style={{ fontSize: 12, fontWeight: 700, color: T.sub }}>EVENTOS DO JOGO</div>
            <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
              <span style={{ fontSize: 10, color: T.sub }}>Desfasamento</span>
              <input type="number" value={offset} onChange={(e) => { const v = Number(e.target.value); setOffset(v); atualizar({ offsetSegundos: v }); }} style={{ ...inputStyle, width: 60, padding: "4px 6px", fontSize: 11 }} />
              <span style={{ fontSize: 10, color: T.sub }}>s</span>
            </div>
          </div>
          <div style={{ display: "flex", gap: 6, overflowX: "auto", paddingBottom: 6 }}>
            {eventosJogo.map((a) => (
              <button key={a.id} onClick={() => seekAbs(a.minuto * 60 + offset)} style={{ flexShrink: 0, background: T.card, border: `1px solid ${T.sep}`, borderRadius: 10, padding: "6px 10px", fontSize: 11, fontWeight: 700, color: T.text, cursor: "pointer", fontFamily: FONT, whiteSpace: "nowrap" }}>{emojiFor(a.tipo)} {a.minuto}' {a.tipo}</button>
            ))}
          </div>
        </div>
      )}

      {capturas.length > 0 && (
        <div style={{ marginTop: 20 }}>
          <div style={{ fontSize: 12, fontWeight: 700, color: T.sub, marginBottom: 8 }}>ANOTAÇÕES ({capturas.length})</div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(140px, 1fr))", gap: 10 }}>
            {capturas.map((c) => (
              <div key={c.id} style={{ background: T.card, border: `1px solid ${T.sep}`, borderRadius: 12, overflow: "hidden" }}>
                {c.capa ? <img src={c.capa} alt="" style={{ width: "100%", aspectRatio: "16/9", objectFit: "cover", display: "block" }} /> : <div style={{ width: "100%", aspectRatio: "16/9", background: T.card2 }} />}
                <div style={{ padding: 8, display: "flex", gap: 6 }}>
                  <button onClick={() => setEditandoCapturaId(c.id)} style={{ ...ctrlBtnStyle, flex: 1, fontSize: 11, padding: "5px 0" }}>✎ Editar</button>
                  <button onClick={() => removerCaptura(c.id)} style={{ ...ctrlBtnStyle, color: T.danger, fontSize: 11, padding: "5px 8px" }}>✕</button>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      <details style={{ marginTop: 20 }}>
        <summary style={{ fontSize: 12, fontWeight: 700, color: T.sub, cursor: "pointer" }}>Criar clipe com início e fim (opcional)</summary>
        <div style={{ marginTop: 12 }}>
          <div style={{ display: "flex", gap: 10, marginBottom: 14 }}>
            <button onClick={() => setMarcaInicio(currentTime)} style={{ flex: 1, background: T.card, border: `1px solid ${T.sep}`, borderRadius: 12, padding: "10px 0", fontSize: 12, fontWeight: 700, color: T.text, cursor: "pointer", fontFamily: FONT }}>🅼 Marcar Início ({formatTempo(marcaInicio ?? currentTime)})</button>
            <button onClick={() => setFormClip({ inicio: marcaInicio ?? currentTime, fim: currentTime, nome: "", categoria: CLIP_CATEGORIAS[0], cor: accessibleAccent(club.corPrimaria), etiquetas: [], jogadoresIds: [], observacoes: "" })} style={{ flex: 1, background: T.text, border: "none", borderRadius: 12, padding: "10px 0", fontSize: 12, fontWeight: 700, color: "#000", cursor: "pointer", fontFamily: FONT }}>🅼 Marcar Fim e Criar Clipe</button>
          </div>

          <div style={{ display: "flex", gap: 8, marginBottom: 10, flexWrap: "wrap" }}>
            <input placeholder="🔍 Pesquisar clipes (nome ou etiqueta)" value={busca} onChange={(e) => setBusca(e.target.value)} style={{ ...inputStyle, flex: 1, minWidth: 160 }} />
            <select value={filtroCategoria} onChange={(e) => setFiltroCategoria(e.target.value)} style={{ ...inputStyle, width: "auto" }}>
              <option value="">Todas as categorias</option>
              {CLIP_CATEGORIAS.map((c) => <option key={c} value={c}>{c}</option>)}
            </select>
          </div>

          <div style={{ fontSize: 12, fontWeight: 700, color: T.sub, marginBottom: 8 }}>CLIPES ({clipesFiltrados.length})</div>
          {clipesFiltrados.length === 0 && <div style={{ textAlign: "center", color: T.sub, fontSize: 13, padding: 24 }}>Ainda sem clipes.</div>}
          {clipesFiltrados.map((c) => (
            <div key={c.id} style={{ background: T.card, border: `1px solid ${T.sep}`, borderLeft: `4px solid ${c.cor}`, borderRadius: 12, padding: 12, marginBottom: 8 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 8 }}>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 13, fontWeight: 700 }}>{c.nome || "(sem nome)"}</div>
                  <div style={{ fontSize: 11, color: T.sub, marginTop: 2 }}>{formatTempo(c.inicio)} – {formatTempo(c.fim)} · {c.categoria}</div>
                  {c.etiquetas?.length > 0 && <div style={{ fontSize: 10, color: T.sub, marginTop: 4 }}>{c.etiquetas.map((e) => `#${e}`).join(" ")}</div>}
                  {c.observacoes && <div style={{ fontSize: 11, color: T.sub, marginTop: 4, fontStyle: "italic" }}>{c.observacoes}</div>}
                  {c.capa && <img src={c.capa} alt="" style={{ width: "100%", maxWidth: 220, borderRadius: 8, marginTop: 8 }} />}
                </div>
                <div style={{ display: "flex", flexDirection: "column", gap: 4, flexShrink: 0 }}>
                  <button onClick={() => seekAbs(c.inicio)} style={ctrlBtnStyle}>▶️ Ver</button>
                  <button onClick={() => setFormClip(c)} style={ctrlBtnStyle}>✎</button>
                  <button onClick={() => setAnotandoClip(c.id)} style={ctrlBtnStyle}>🎨</button>
                  <button onClick={() => removerClip(c.id)} style={{ ...ctrlBtnStyle, color: T.danger }}>✕</button>
                </div>
              </div>
            </div>
          ))}
        </div>
      </details>

      {(clipes.length > 0 || capturas.length > 0) && <ExportarClipesBtn club={club} projeto={projeto} clipes={clipes} capturas={capturas} />}

      {formClip && (
        <FormClipModal club={club} players={players} clip={formClip} onGuardar={guardarClip} onFechar={() => setFormClip(null)} />
      )}
      {clipEmAnotacao && (
        <AnotarClipModal clip={clipEmAnotacao} capturarFrame={capturarFrame} onGuardar={(patch) => { guardarClip({ ...clipEmAnotacao, ...patch }); setAnotandoClip(null); }} onFechar={() => setAnotandoClip(null)} />
      )}
      {capturaEmEdicao && (
        <AnotarClipModal clip={capturaEmEdicao} capturarFrame={capturarFrame}
          onGuardar={(patch) => guardarCaptura({ ...capturaEmEdicao, ...patch })}
          onFechar={() => setEditandoCapturaId(null)} />
      )}
    </div>
  );
}

function FormClipModal({ club, players, clip, onGuardar, onFechar }) {
  const [nome, setNome] = useState(clip.nome || "");
  const [categoria, setCategoria] = useState(clip.categoria || CLIP_CATEGORIAS[0]);
  const [inicio, setInicio] = useState(formatTempo(clip.inicio));
  const [fim, setFim] = useState(formatTempo(clip.fim));
  const [cor, setCor] = useState(clip.cor || CORES_DESENHO[0]);
  const [etiquetasTxt, setEtiquetasTxt] = useState((clip.etiquetas || []).join(", "));
  const [jogadoresIds, setJogadoresIds] = useState(clip.jogadoresIds || []);
  const [observacoes, setObservacoes] = useState(clip.observacoes || "");

  const toggleJogador = (id) => setJogadoresIds((prev) => (prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]));
  const guardar = () => {
    onGuardar({
      ...clip, nome: nome.trim() || "Clipe sem nome", categoria,
      inicio: parseTempoInput(inicio), fim: parseTempoInput(fim), cor,
      etiquetas: etiquetasTxt.split(",").map((s) => s.trim()).filter(Boolean),
      jogadoresIds, observacoes,
    });
  };

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.7)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 200, padding: 16 }} onClick={onFechar}>
      <div onClick={(e) => e.stopPropagation()} style={{ background: T.card, borderRadius: 18, padding: 20, width: "100%", maxWidth: 480, maxHeight: "85vh", overflowY: "auto" }}>
        <div style={{ fontSize: 15, fontWeight: 700, marginBottom: 14 }}>{clip.id ? "Editar Clipe" : "Novo Clipe"}</div>
        <Field label="Nome"><input style={inputStyle} value={nome} onChange={(e) => setNome(e.target.value)} placeholder="ex: 2º Golo" /></Field>
        <Field label="Categoria">
          <select style={inputStyle} value={categoria} onChange={(e) => setCategoria(e.target.value)}>{CLIP_CATEGORIAS.map((c) => <option key={c} value={c}>{c}</option>)}</select>
        </Field>
        <div style={{ display: "flex", gap: 10 }}>
          <Field label="Início (mm:ss)"><input style={inputStyle} value={inicio} onChange={(e) => setInicio(e.target.value)} /></Field>
          <Field label="Fim (mm:ss)"><input style={inputStyle} value={fim} onChange={(e) => setFim(e.target.value)} /></Field>
        </div>
        <div style={{ fontSize: 12, fontWeight: 700, color: T.sub, marginBottom: 6 }}>COR</div>
        <div style={{ display: "flex", gap: 6, marginBottom: 14 }}>

  const ferramentas = [["seta", "↗️"], ["linha", "／"], ["circulo", "⭕"], ["retangulo", "▭"], ["livre", "✏️"], ["texto", "🅣"], ["holofote", "🔦"]];

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.85)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 200, padding: 16 }}>

        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
          <div style={{ fontSize: 14, fontWeight: 700 }}>🎨 Anotar — {clip.nome}</div>

          </div>
        )}

        <DrawingCanvas largura="100%" altura={capa ? undefined : 260} shapes={shapes} setShapes={setShapes} ferramenta={ferramenta} cor={cor} espessura={espessura} fundo={capa} />

        <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginTop: 12, marginBottom: 10 }}>
          {ferramentas.map(([k, icon]) => (
            <button key={k} onClick={() => setFerramenta(k)} style={{ background: ferramenta === k ? T.text : T.card2, color: ferramenta === k ? "#000" : T.text, border: `1px solid ${T.sep}`, borderRadius: 8, padding: "6px 10px", fontSize: 14, cursor: "pointer" }}>{icon}</button>
          ))}
          <button onClick={() => setShapes([])} style={{ ...ctrlBtnStyle, color: T.danger }}>Limpar</button>

        </div>
        <div style={{ display: "flex", gap: 6, alignItems: "center", marginBottom: 14 }}>
          {CORES_DESENHO.map((c) => <div key={c} onClick={() => setCor(c)} style={{ width: 22, height: 22, borderRadius: 11, background: c, cursor: "pointer", border: cor === c ? `2px solid ${T.warning}` : "2px solid rgba(255,255,255,0.3)" }} />)}
          <input type="range" min="0.5" max="3" step="0.1" value={espessura} onChange={(e) => setEspessura(Number(e.target.value))} style={{ flex: 1, marginLeft: 8 }} />
        </div>

        {capa && (
          <div style={{ display: "flex", gap: 10 }}>

          </div>
        )}
        {!capa && <div style={{ fontSize: 11, color: T.sub, textAlign: "center" }}>Podes desenhar já sem captura (fica sobre fundo escuro), ou capturar o fotograma atual do vídeo primeiro.</div>}
